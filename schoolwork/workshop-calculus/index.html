<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>高数在车间 · Workshop Calculus｜写给机械新生的应用高等数学课</title>
<meta name="description" content="写给机械设计与制造专业大一新生的应用高等数学课：曲柄滑块讲导数，弹簧、飞轮与梁讲积分，振动与泰勒展开讲微分方程。9 节可动手的实时演示。">
<meta name="theme-color" content="#f6eddd">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f6eddd'/%3E%3Cpath d='M16 4v24M4 16h24M8 8l16 16M24 8L8 24' stroke='%2318213d' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%230f8b8d' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6eddd; --bg-deep:#efe2cf; --rail:#e9dcca;
  --card:#faf4e8; --card-soft:rgba(250,244,232,.88);
  --ink:#18213d; --body:#4d5159; --muted:#7c7568; --faint:#a89a88;
  --line:#d5c5ae; --line-soft:#e4d7c4;
  --teal:#0f8b8d; --teal-2:#1aa3a1; --teal-soft:rgba(15,139,141,.10);
  --amber:#b85f28; --gold:#b98a3a;
  --sans:"Barlow","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --cond:"Barlow Semi Condensed","Barlow","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --max:1200px;
  --rail-w:74px;
  --top-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  min-height:100vh;min-height:100dvh;
  color:var(--body);background-color:var(--bg);
  background-image:
    linear-gradient(rgba(24,33,61,.040) 1px,transparent 1px),
    linear-gradient(90deg,rgba(24,33,61,.040) 1px,transparent 1px),
    linear-gradient(rgba(24,33,61,.021) 1px,transparent 1px),
    linear-gradient(90deg,rgba(24,33,61,.021) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  font-family:var(--sans);font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 0%,transparent 45%,rgba(120,95,60,.10) 100%),
    linear-gradient(90deg,rgba(233,220,202,.55),rgba(233,220,202,0) 220px);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
canvas{display:block}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
::selection{background:rgba(15,139,141,.18)}

/* ================= loader ================= */
#loader{
  position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:var(--bg);transition:opacity .55s ease,visibility .55s ease;
}
#loader.gone{opacity:0;visibility:hidden}
.loader-inner{display:grid;justify-items:center;gap:14px;width:min(300px,72vw)}
.loader-gear{width:54px;height:54px;color:var(--ink)}
.loader-gear .spin{transform-origin:50% 50%;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-title{font-family:var(--cond);font-weight:600;font-size:20px;letter-spacing:.14em;color:var(--ink)}
.loader-sub{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.loader-track{width:100%;height:3px;background:#e2d5c1;overflow:hidden;margin-top:4px}
.loader-fill{display:block;height:100%;width:0;background:var(--teal);animation:load 1.1s ease forwards}
@keyframes load{to{width:100%}}

/* ================= rail ================= */
.rail{
  position:fixed;left:0;top:0;bottom:0;width:var(--rail-w);z-index:60;
  background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:16px 0 14px;gap:4px;
}
.rail-logo{width:38px;height:38px;display:grid;place-items:center;color:var(--ink);margin-bottom:14px;text-decoration:none}
.rail-logo svg{width:30px;height:30px}
.rail-btn{
  width:60px;padding:9px 0 7px;display:grid;justify-items:center;gap:3px;
  color:var(--muted);border-radius:2px;position:relative;transition:color .15s,background .15s;
}
.rail-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rail-btn span{font-family:var(--cond);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.rail-btn:hover,.rail-btn.is-on{background:rgba(24,33,61,.07);color:var(--ink)}
.rail-btn.is-on::before{content:"";position:absolute;left:-7px;top:8px;bottom:8px;width:2px;background:var(--teal)}
.rail-prog{
  margin-top:14px;display:grid;justify-items:center;gap:5px;
  font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.04em;
}
.rail-ring{
  --p:0;
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--teal) calc(var(--p)*1%), #ddceba 0);
}
.rail-ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--rail)}
.rail-ring b{position:relative;z-index:1;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink)}
.rail .spacer{flex:1}
.rail-reset{color:var(--faint)}
.rail-reset:hover{color:var(--amber);background:rgba(184,95,40,.08)}

/* ================= topbar ================= */
.app{margin-left:var(--rail-w);position:relative;z-index:1;min-height:100vh;min-height:100dvh}
.topbar{
  position:sticky;top:0;z-index:50;height:var(--top-h);
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:0 26px;border-bottom:1px solid var(--line);
  background:rgba(246,237,221,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.tb-left{display:flex;align-items:center;gap:18px;min-width:0}
.tb-back{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--cond);font-size:12px;
  letter-spacing:.06em;color:var(--muted);padding:6px 10px 6px 6px;border:1px solid transparent;
}
.tb-back[hidden]{display:none}
.tb-back:hover{color:var(--ink);border-color:var(--line);background:var(--card-soft)}
.tb-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb-brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.tb-kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--teal);white-space:nowrap}
.tb-brand h1{font-family:var(--cond);font-weight:600;font-size:19px;letter-spacing:.06em;color:var(--ink);white-space:nowrap}
.tb-right{display:flex;align-items:center;gap:18px}
.tb-prog{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.tb-bar{width:74px;height:3px;background:#e0d2be;overflow:hidden}
.tb-bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s}
.tb-chip{
  font-family:var(--cond);font-size:11px;letter-spacing:.08em;color:var(--muted);
  border:1px solid var(--line);padding:4px 10px;white-space:nowrap;
}

/* ================= shared bits ================= */
#view{position:relative}
.home{max-width:var(--max);margin:0 auto;padding:0 34px}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);
}
.eyebrow i{display:block;width:26px;height:1px;background:var(--teal)}
.btn-primary,.btn-ghost{
  display:inline-flex;align-items:center;gap:9px;font-family:var(--cond);font-weight:600;
  font-size:14px;letter-spacing:.05em;padding:12px 20px;border:1px solid var(--ink);
  transition:background .18s,color .18s,transform .18s,border-color .18s;text-decoration:none;
}
.btn-primary{background:var(--ink);color:#f6eddd;border-color:var(--ink)}
.btn-primary:hover{background:var(--teal);border-color:var(--teal);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink);background:var(--card-soft)}
.btn-primary svg,.btn-ghost svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ================= hero ================= */
.hero{
  display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(30px,4.5vw,64px);
  align-items:center;padding:clamp(40px,7vh,78px) 0 clamp(40px,6vh,64px);
}
.hero-copy h1{
  font-family:var(--cond);font-weight:600;color:var(--ink);
  font-size:clamp(2.5rem,5.2vw,4.35rem);line-height:1.02;letter-spacing:-.015em;
  margin:18px 0 0;
}
.hero-copy h1 em{font-style:normal;color:var(--teal);position:relative;white-space:nowrap}
.hero-copy h1 em::after{
  content:"";position:absolute;left:1%;right:1%;bottom:.035em;height:.045em;
  background:var(--teal);opacity:.16;
}
.lede{margin-top:22px;max-width:33em;font-size:15.5px;line-height:1.95;color:var(--body)}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero-stats{display:flex;gap:34px;list-style:none;margin-top:34px;padding-top:22px;border-top:1px solid var(--line-soft)}
.hero-stats li{display:flex;align-items:baseline;gap:7px}
.hero-stats b{font-family:var(--cond);font-size:26px;font-weight:600;color:var(--ink);line-height:1}
.hero-stats span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.hero-fig{position:relative}
.fig-frame{
  position:relative;aspect-ratio:4/3.15;border:1px solid var(--line);background:var(--card);
  box-shadow:10px 10px 0 rgba(24,33,61,.045),0 18px 40px rgba(24,33,61,.08);
}
.fig-frame canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.fig-frame canvas:active{cursor:grabbing}
.corner{position:absolute;width:11px;height:11px;border-color:var(--ink);border-style:solid;opacity:.55}
.corner.tl{top:-5px;left:-5px;border-width:1px 0 0 1px}
.corner.tr{top:-5px;right:-5px;border-width:1px 1px 0 0}
.corner.bl{bottom:-5px;left:-5px;border-width:0 0 1px 1px}
.corner.br{bottom:-5px;right:-5px;border-width:0 1px 1px 0}
.fig-tag{
  position:absolute;top:12px;left:12px;font-family:var(--mono);font-size:9px;
  letter-spacing:.14em;color:var(--muted);background:rgba(246,237,221,.8);padding:3px 7px;
}
.fig-caption{
  display:flex;gap:10px;margin-top:14px;font-family:var(--mono);font-size:10px;
  color:var(--muted);line-height:1.7;
}
.fig-caption b{color:var(--teal);font-weight:500;letter-spacing:.1em;white-space:nowrap}

/* ================= chapters ================= */
.chapters{padding:12px 0 8px}
.chapter{margin-top:clamp(34px,5vh,56px)}
.ch-head{
  display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:start;
  padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px;
}
.ch-no{font-family:var(--cond);font-size:40px;line-height:.9;font-weight:600;color:var(--teal);opacity:.9}
.ch-en{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.ch-head h2{font-family:var(--cond);font-weight:600;font-size:clamp(1.35rem,2.3vw,1.75rem);color:var(--ink);line-height:1.2;margin-top:2px}
.ch-head p{font-size:13px;color:var(--muted);margin-top:5px;max-width:52em}
.ch-math{
  font-family:var(--mono);font-size:15px;color:var(--ink);padding:8px 12px;
  border:1px solid var(--line);background:var(--card-soft);white-space:nowrap;align-self:center;
}
.lesson-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lesson-card{
  position:relative;display:flex;flex-direction:column;gap:9px;min-height:172px;
  padding:18px 18px 15px;background:var(--card-soft);border:1px solid var(--line);
  cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s,background .18s;
}
.lesson-card:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:0 14px 28px rgba(24,33,61,.09);background:var(--card)}
.lc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lc-no{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--teal)}
.lc-tag{
  font-family:var(--cond);font-size:10px;letter-spacing:.1em;color:var(--muted);
  border:1px solid var(--line);padding:1px 8px;background:rgba(246,237,221,.6);
}
.lesson-card h3{font-family:var(--cond);font-weight:600;font-size:1.22rem;color:var(--ink);line-height:1.25}
.lesson-card p{font-size:12.5px;line-height:1.7;color:var(--muted);flex:1}
.lc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dotted var(--line);padding-top:9px;margin-top:2px}
.lc-en{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--faint)}
.lc-go{font-family:var(--cond);font-size:11.5px;letter-spacing:.06em;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.lesson-card:hover .lc-go{color:var(--teal)}
.lc-done{
  position:absolute;top:-1px;right:-1px;width:22px;height:22px;display:none;place-items:center;
  background:var(--teal);color:#f6eddd;font-size:11px;
}
.lesson-card.is-done .lc-done{display:grid}
.lesson-card.is-done .lc-no{color:var(--muted)}

/* ================= formula map / how ================= */
.map-sec{padding:clamp(48px,8vh,80px) 0 10px;border-top:1px solid var(--line);margin-top:clamp(44px,7vh,72px)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.sec-head h2{font-family:var(--cond);font-weight:600;font-size:clamp(1.5rem,2.8vw,2rem);color:var(--ink);line-height:1.15;margin-top:6px}
.sec-head p{font-size:13px;color:var(--muted);max-width:34em}
.map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.map-col{background:var(--card-soft);border:1px solid var(--line);padding:20px 20px 18px}
.map-col .mc-no{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--teal)}
.map-col h3{font-family:var(--cond);font-size:1.16rem;font-weight:600;color:var(--ink);margin-top:4px}
.map-col .mc-en{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.map-col ul{list-style:none;margin-top:13px;display:grid;gap:8px}
.map-col li{display:flex;justify-content:space-between;gap:12px;font-size:12px;border-bottom:1px dotted var(--line);padding-bottom:7px}
.map-col li span{color:var(--muted)}
.map-col li b{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.map-col .mc-note{margin-top:14px;font-size:11.5px;line-height:1.75;color:var(--muted);border-left:2px solid var(--teal);padding-left:10px}

.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:clamp(44px,7vh,70px) 0}
.how-item{display:flex;gap:13px;align-items:flex-start}
.how-num{
  flex:none;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--ink);
  font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--card-soft);
}
.how-item h4{font-family:var(--cond);font-size:1rem;font-weight:600;color:var(--ink);line-height:1.3}
.how-item p{font-size:12px;color:var(--muted);line-height:1.7;margin-top:3px}

.home-foot{
  border-top:1px solid var(--line);padding:22px 0 34px;display:flex;justify-content:space-between;
  gap:16px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--faint);flex-wrap:wrap;
}
.home-foot b{color:var(--muted);font-weight:500}

/* ================= lesson view ================= */
.lesson-view{
  display:grid;grid-template-columns:minmax(0,1fr) 410px;
  height:calc(100dvh - var(--top-h));min-height:560px;
}
.stage-col{display:flex;flex-direction:column;gap:10px;padding:16px 18px 14px;min-width:0}
.stage-card{
  position:relative;flex:1;min-height:0;border:1px solid var(--line);overflow:hidden;
  background-color:var(--card);
  background-image:
    linear-gradient(rgba(24,33,61,.042) 1px,transparent 1px),
    linear-gradient(90deg,rgba(24,33,61,.042) 1px,transparent 1px),
    linear-gradient(rgba(24,33,61,.020) 1px,transparent 1px),
    linear-gradient(90deg,rgba(24,33,61,.020) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  box-shadow:inset 0 0 60px rgba(120,95,60,.06);
}
.stage-card canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.stage-hud{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:2}
.hud-tag{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;color:var(--muted);
  background:rgba(250,244,232,.92);border:1px solid var(--line);padding:4px 8px;
}
.hud-chip{
  display:inline-flex;align-items:baseline;gap:6px;background:rgba(250,244,232,.94);
  border:1px solid var(--line);padding:3px 9px 4px;box-shadow:0 1px 0 rgba(24,33,61,.04);
}
.hud-chip span{font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;color:var(--muted)}
.hud-chip b{font-family:var(--mono);font-weight:600;font-size:11px;color:var(--ink);letter-spacing:-.01em}
.hud-chip.hot b{color:var(--amber)}
.stage-ctl{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;z-index:2;flex-wrap:wrap}
.mini-btn{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--cond);font-size:10.5px;
  letter-spacing:.06em;color:var(--ink);background:rgba(250,244,232,.94);border:1px solid var(--line);
  padding:5px 10px;transition:background .15s,border-color .15s;
}
.mini-btn:hover{background:#fff8ec;border-color:var(--ink)}
.mini-btn svg{width:12px;height:12px;fill:currentColor}
.stage-note{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--muted);
  background:rgba(246,237,221,.75);padding:4px 8px;border:1px dashed var(--line);
}
.stage-caption{
  display:flex;gap:10px;font-family:var(--mono);font-size:9px;letter-spacing:.04em;
  color:var(--muted);line-height:1.6;padding-left:2px;
}
.stage-caption b{color:var(--teal);font-weight:500;letter-spacing:.1em;white-space:nowrap}

.panel{
  border-left:1px solid var(--line);background:rgba(250,244,232,.55);
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.panel-inner{padding:26px 26px 40px}
.p-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--teal);text-transform:uppercase}
.p-title{font-family:var(--cond);font-weight:600;font-size:2.1rem;line-height:1.1;color:var(--ink);margin-top:6px}
.p-en{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--faint);margin-top:5px}
.p-lead{
  font-family:var(--cond);font-size:1.14rem;line-height:1.55;color:var(--ink);
  border-left:2px solid var(--teal);padding-left:12px;margin:18px 0 14px;
}
.p-text p{font-size:13px;line-height:1.9;color:var(--body);margin-bottom:10px}
.p-text p:last-child{margin-bottom:0}
.p-text b{color:var(--ink);font-weight:600}
.p-text mark{background:rgba(15,139,141,.10);color:var(--teal);padding:0 2px}
.formula{
  position:relative;background:var(--ink);color:#f3e7d3;padding:16px 16px 14px;
  font-family:var(--mono);font-size:12px;line-height:2.05;margin:16px 0 4px;
  overflow-x:auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}
.formula::before{
  content:"KEY RELATION";position:absolute;top:6px;right:9px;font-size:7.5px;
  letter-spacing:.15em;color:rgba(243,231,211,.34);
}
.formula .fx{white-space:nowrap}
.formula b{color:#83d6d2;font-weight:500}
.formula .dim{color:rgba(243,231,211,.52)}
.formula .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 .12em;font-size:.92em}
.formula .frac>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em}

.controls{margin:20px 0 4px;padding-top:16px;border-top:1px solid var(--line-soft)}
.controls-head{
  font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--muted);
  display:flex;align-items:center;gap:8px;margin-bottom:14px;
}
.controls-head i{display:block;width:5px;height:5px;background:var(--teal);border-radius:50%}
.ctl{margin-bottom:15px}
.ctl:last-child{margin-bottom:0}
.ctl-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.ctl-head label{font-size:12.5px;color:var(--body)}
.ctl-head output{font-family:var(--mono);font-size:10.5px;color:var(--ink);white-space:nowrap}
.ctl input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;
}
.ctl input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
.ctl input[type=range]::-moz-range-track{height:2px;background:var(--line)}
.ctl input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-5.5px;
  background:var(--card);border:1.5px solid var(--ink);border-radius:50%;
  box-shadow:0 1px 3px rgba(24,33,61,.18);transition:border-color .15s,background .15s;
}
.ctl input[type=range]::-moz-range-thumb{
  width:12px;height:12px;background:var(--card);border:1.5px solid var(--ink);border-radius:50%;
}
.ctl input[type=range]:hover::-webkit-slider-thumb{border-color:var(--teal);background:#eefcfb}
.ctl-hint{font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;color:var(--faint);margin-top:2px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{
  font-family:var(--cond);font-size:11px;letter-spacing:.05em;padding:4px 10px;
  border:1px solid var(--line);color:var(--muted);background:transparent;transition:all .15s;
}
.seg button:hover{border-color:var(--ink);color:var(--ink)}
.seg button.is-on{background:var(--ink);border-color:var(--ink);color:#f6eddd}
.ctl-toggle{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--body);cursor:pointer;user-select:none}
.ctl-toggle input{position:absolute;opacity:0;pointer-events:none}
.ctl-toggle i{
  width:30px;height:16px;border:1px solid var(--line);background:var(--bg-deep);position:relative;flex:none;transition:background .15s,border-color .15s;
}
.ctl-toggle i::after{
  content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--muted);transition:transform .18s,background .18s;
}
.ctl-toggle input:checked + i{background:var(--teal-soft);border-color:var(--teal)}
.ctl-toggle input:checked + i::after{transform:translateX(14px);background:var(--teal)}

.callout{
  margin-top:20px;background:rgba(15,139,141,.055);border:1px solid rgba(15,139,141,.20);
  border-left:2px solid var(--teal);padding:12px 13px;
}
.callout .co-k{
  display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.14em;color:var(--teal);text-transform:uppercase;margin-bottom:5px;
}
.callout .co-k svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.callout p{font-size:12px;line-height:1.8;color:var(--body)}
.callout p b{color:var(--ink)}
.think{margin-top:18px;border-top:1px dotted var(--line);padding-top:12px}
.think summary{
  list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;
}
.think summary::-webkit-details-marker{display:none}
.think summary::before{content:"+";width:16px;height:16px;display:grid;place-items:center;border:1px solid var(--line);font-size:11px;line-height:1}
.think[open] summary::before{content:"−"}
.think[open] summary{color:var(--teal)}
.think p{font-size:12px;line-height:1.85;color:var(--body);margin-top:9px;padding-left:24px}

.p-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.p-nav button{
  font-family:var(--cond);font-size:11.5px;letter-spacing:.05em;color:var(--muted);
  border:1px solid transparent;padding:6px 8px;transition:all .15s;
}
.p-nav button:hover{color:var(--ink);border-color:var(--line);background:var(--card)}
.p-nav button:disabled{opacity:.3;cursor:not-allowed}
.done-btn{background:var(--teal)!important;border-color:var(--teal)!important;color:#f6eddd!important;padding:7px 13px!important}
.done-btn:hover{background:var(--ink)!important;border-color:var(--ink)!important}
.done-btn.is-done{background:transparent!important;border-color:var(--teal)!important;color:var(--teal)!important}

/* ================= noscript / toast ================= */
.noscript{max-width:760px;margin:80px auto;padding:0 24px;line-height:1.9}
.noscript h1{font-family:var(--cond);color:var(--ink);font-size:2rem;margin-bottom:12px}
.noscript ol{margin:16px 0 0 20px}
.noscript a{color:var(--teal)}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:150;
  background:var(--ink);color:#f6eddd;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.05em;padding:9px 16px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= responsive ================= */
@media (max-width:1180px){
  .lesson-view{grid-template-columns:minmax(0,1fr) 380px}
  .home{padding:0 26px}
}
@media (max-width:1024px){
  .hero{grid-template-columns:1fr;gap:34px}
  .hero-fig{max-width:620px;width:100%}
  .lesson-grid{grid-template-columns:repeat(2,1fr)}
  .map-grid{grid-template-columns:1fr 1fr}
  .map-col:last-child{grid-column:1/-1}
  .lesson-view{grid-template-columns:minmax(0,1fr) 350px}
  .panel-inner{padding:22px 20px 34px}
  .p-title{font-size:1.8rem}
}
@media (max-width:820px){
  :root{--rail-w:0px}
  .rail{display:none}
  .app{margin-left:0}
  .topbar{padding:0 16px;height:58px}
  .tb-chip{display:none}
  .tb-kicker{display:none}
  .tb-brand h1{font-size:17px}
  .home{padding:0 18px}
  .hero{padding:30px 0 34px}
  .hero-stats{gap:24px}
  .lesson-grid{grid-template-columns:1fr 1fr;gap:12px}
  .lesson-view{display:block;height:auto;min-height:0}
  .stage-col{padding:12px 12px 8px}
  .stage-card{height:56dvh;min-height:380px}
  .stage-on-mobile{}
  .panel{border-left:none;border-top:1px solid var(--line);overflow:visible}
  .panel-inner{padding:22px 18px 46px}
  .stage-caption{padding:0 2px 4px}
  .ch-head{grid-template-columns:auto 1fr;gap:14px}
  .ch-math{display:none}
  .how{grid-template-columns:1fr;gap:18px}
  .map-grid{grid-template-columns:1fr}
  .map-col:last-child{grid-column:auto}
  .home-foot{flex-direction:column;gap:6px}
}
@media (max-width:560px){
  body{font-size:14px}
  .hero-copy h1{font-size:clamp(2.1rem,10.5vw,2.9rem)}
  .hero-stats{border-top:none;padding-top:0;margin-top:24px;gap:22px}
  .hero-stats b{font-size:22px}
  .lesson-grid{grid-template-columns:1fr}
  .lesson-card{min-height:0}
  .tb-prog .tb-bar{display:none}
  .hud-tag{display:none}
  .hud-chip{padding:2px 7px 3px}
  .hud-chip span{font-size:8px}
  .hud-chip b{font-size:10px}
  .stage-card{height:52dvh;min-height:320px}
  .stage-note{display:none}
  .p-title{font-size:1.65rem}
  .p-lead{font-size:1.04rem}
  .p-nav button{font-size:10.5px;padding:6px 5px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>

<body>
<div id="loader" role="status" aria-live="polite">
  <div class="loader-inner">
    <svg class="loader-gear" viewBox="0 0 48 48" aria-hidden="true">
      <g class="spin" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <circle cx="24" cy="24" r="13.5"/>
        <circle cx="24" cy="24" r="4.5"/>
        <path d="M24 6.5v5M24 36.5v5M6.5 24h5M36.5 24h5M11.6 11.6l3.5 3.5M32.9 32.9l3.5 3.5M36.4 11.6l-3.5 3.5M15.1 32.9l-3.5 3.5"/>
      </g>
    </svg>
    <p class="loader-title">高数在车间</p>
    <p class="loader-sub">Workshop Calculus · 9 interactive lessons</p>
    <div class="loader-track"><span class="loader-fill"></span></div>

</div>

<aside class="rail" aria-label="课程导航">
  <a class="rail-logo" href="#/" aria-label="返回课程目录">
    <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <circle cx="18" cy="18" r="9.5"/><circle cx="18" cy="18" r="3.2"/>
      <path d="M18 3.5v4M18 28.5v4M3.5 18h4M28.5 18h4M7.7 7.7l2.8 2.8M25.5 25.5l2.8 2.8M28.3 7.7l-2.8 2.8M10.5 25.5l-2.8 2.8"/>
    </svg>
  </a>
  <button class="rail-btn" data-rail="home" title="课程目录">
    <svg viewBox="0 0 24 24"><path d="M4 5.5h7v6H4zM13 5.5h7v6h-7zM4 13.5h7v5H4zM13 13.5h7v5h-7z"/></svg>
    <span>目录</span>
  </button>
  <button class="rail-btn" data-rail="map" title="公式地图">
    <svg viewBox="0 0 24 24"><path d="M5 18.5V6h14v12.5M8 15.5l2.6-3.4 2.3 2 3.1-4.4M5 18.5h14"/></svg>
    <span>公式</span>
  </button>
  <div class="rail-prog" aria-label="学习进度">
    <div class="rail-ring" id="railRing" style="--p:0"><b id="railProg">0</b></div>
    <span>PROGRESS</span>
  </div>
  <div class="spacer"></div>
  <button class="rail-btn rail-reset" id="resetProgress" title="清空学习进度">

    <span>重置</span>
  </button>
</aside>

<div class="app">
  <header class="topbar">
    <div class="tb-left">
      <button class="tb-back" id="backBtn" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        <span>课程目录</span>
      </button>
      <div class="tb-brand">
        <span class="tb-kicker">WORKSHOP CALCULUS</span>
        <h1>高数在车间</h1>
      </div>
    </div>
    <div class="tb-right">
      <div class="tb-prog" title="学习进度">
        <span>进度</span>
        <span id="progText">0 / 9</span>
        <span class="tb-bar"><i id="progBar"></i></span>
      </div>
      <span class="tb-chip">机械设计与制造 · 大一</span>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <noscript>
      <div class="noscript">
        <h1>高数在车间 · Workshop Calculus</h1>
        <p>把应用高等数学装回机械里：曲柄滑块讲导数，弹簧、飞轮与梁讲积分，振动与泰勒展开讲微分方程。</p>
        <ol>
          <li>曲柄滑块：位置、速度、加速度</li>
          <li>齿轮传动：链式法则与传动比</li>
          <li>切削速度：导数为零找到最省成本</li>
          <li>变力做功：力–位移曲线下的面积</li>
          <li>转动惯量：为什么飞轮把铁放在轮缘</li>
          <li>梁的挠度：积分两次，载荷变成曲线</li>
          <li>简谐振动：二阶导数等于负的自己</li>
          <li>阻尼振动：让机床停下来而不是一直晃</li>
          <li>泰勒展开：工程师为什么敢用 sin θ ≈ θ</li>
        </ol>
        <p>本页的实时演示需要启用 JavaScript。</p>
      </div>
    </noscript>
  </main>
</div>
