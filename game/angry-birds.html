          for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.ellipse(side * r * 0.22, -r * 0.24, r * 0.17, r * 0.19, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#26311c";
            ctx.beginPath();
            ctx.arc(side * r * 0.22 + r * 0.04, -r * 0.24, r * 0.08, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(side * r * 0.22 + r * 0.07, -r * 0.27, r * 0.027, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.strokeStyle = "rgba(45, 78, 20, 0.62)";
        ctx.lineWidth = Math.max(1.4, r * 0.075);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-r * 0.37, -r * 0.51);
        ctx.lineTo(-r * 0.1, -r * 0.43);
        ctx.moveTo(r * 0.37, -r * 0.51);
        ctx.lineTo(r * 0.1, -r * 0.43);
        ctx.stroke();

        if (health < 0.65) {
          ctx.strokeStyle = "rgba(255,255,255,0.62)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(r * 0.48, -r * 0.68);
          ctx.lineTo(r * 0.7, -r * 0.56);
          ctx.lineTo(r * 0.55, -r * 0.44);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawBird(type, x, y, radius, angle, options = {}) {
        const def = BIRDS[type];
        const r = radius;
        const face = type === "white";
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // 尾羽
        ctx.save();
        ctx.fillStyle = def.color;
        ctx.strokeStyle = "rgba(0,0,0,0.15)";
        ctx.lineWidth = 1;
        for (let i = -1; i <= 1; i += 1) {
          ctx.beginPath();
          ctx.moveTo(-r * 0.6, i * r * 0.17);
          ctx.lineTo(-r * 1.32, i * r * 0.48 - r * 0.1);
          ctx.lineTo(-r * 1.2, i * r * 0.48 + r * 0.14);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // 身体
        const bodyGradient = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r * 1.12);
        if (type === "black") {
          bodyGradient.addColorStop(0, "#606773");
          bodyGradient.addColorStop(0.48, "#333842");
          bodyGradient.addColorStop(1, "#12151b");
        } else if (type === "yellow") {
          bodyGradient.addColorStop(0, "#fff1a1");
          bodyGradient.addColorStop(0.5, "#f2c52c");
          bodyGradient.addColorStop(1, "#c68b13");
        } else if (type === "white") {
          bodyGradient.addColorStop(0, "#ffffff");
          bodyGradient.addColorStop(0.62, "#eeeade");
          bodyGradient.addColorStop(1, "#c1baa9");
        } else if (type === "silver") {
          bodyGradient.addColorStop(0, "#ffffff");
          bodyGradient.addColorStop(0.5, "#c8ceda");
          bodyGradient.addColorStop(1, "#7b8291");
        } else if (type === "green") {
          bodyGradient.addColorStop(0, "#c8f39b");
          bodyGradient.addColorStop(0.5, "#6fc64e");
          bodyGradient.addColorStop(1, "#377d2a");
        } else if (type === "blue") {
          bodyGradient.addColorStop(0, "#b8ebff");
          bodyGradient.addColorStop(0.48, "#4cb8e5");
          bodyGradient.addColorStop(1, "#1b78a8");
        } else if (type === "bigred") {
          bodyGradient.addColorStop(0, "#f08c77");
          bodyGradient.addColorStop(0.48, "#c83b31");
          bodyGradient.addColorStop(1, "#7f1e19");
        } else {
          bodyGradient.addColorStop(0, "#ff9c87");
          bodyGradient.addColorStop(0.48, "#df4b3b");
          bodyGradient.addColorStop(1, "#92271f");
        }
        ctx.fillStyle = bodyGradient;
        if (face) {
          ctx.beginPath();
          ctx.ellipse(0, 0, r * 0.92, r * 1.05, 0, 0, Math.PI * 2);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.strokeStyle = type === "white" || type === "silver" ? "rgba(83,75,59,0.45)" : "rgba(35,15,9,0.28)";
        ctx.lineWidth = Math.max(1.2, r * 0.07);
        ctx.stroke();

        // 肚皮
        ctx.fillStyle = type === "black" ? "#727987" : type === "yellow" ? "#fff3bb" : type === "green" ? "#d8f1ae" : "#f6e2b7";
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.ellipse(r * 0.05, r * 0.34, r * 0.52, r * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // 标志性羽冠
        if (type === "yellow") {
          ctx.fillStyle = "#f5cd37";
          ctx.beginPath();
          ctx.moveTo(-r * 0.55, -r * 0.66);
          ctx.lineTo(-r * 0.76, -r * 0.08);
          ctx.lineTo(-r * 0.28, -r * 0.5);
          ctx.closePath();
          ctx.fill();
        } else if (type === "blue") {
          ctx.strokeStyle = "#246f99";
          ctx.lineWidth = Math.max(2, r * 0.11);
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-r * 0.3, -r * 0.8);
          ctx.quadraticCurveTo(-r * 0.5, -r * 1.15, -r * 0.62, -r * 1.16);
          ctx.moveTo(-r * 0.02, -r * 0.88);
          ctx.quadraticCurveTo(r * 0.05, -r * 1.2, r * 0.2, -r * 1.22);
          ctx.stroke();
        } else if (type === "green") {
          ctx.fillStyle = "#3f8c2b";
          ctx.beginPath();
          ctx.moveTo(-r * 0.22, -r * 0.74);
          ctx.quadraticCurveTo(-r * 0.72, -r * 1.35, -r * 0.84, -r * 0.96);
          ctx.quadraticCurveTo(-r * 0.66, -r * 0.7, -r * 0.22, -r * 0.74);
          ctx.fill();
        } else if (type === "silver") {
          ctx.fillStyle = "#9ea6b4";
          ctx.beginPath();
          ctx.moveTo(-r * 0.38, -r * 0.76);
          ctx.quadraticCurveTo(-r * 0.08, -r * 1.42, r * 0.36, -r * 0.94);
          ctx.quadraticCurveTo(r * 0.02, -r * 0.98, -r * 0.08, -r * 0.72);
          ctx.closePath();
          ctx.fill();
        } else if (type === "black") {
          ctx.strokeStyle = "#4b4033";
          ctx.lineWidth = Math.max(1.8, r * 0.08);
          ctx.beginPath();
          ctx.moveTo(0, -r * 0.94);
          ctx.quadraticCurveTo(r * 0.2, -r * 1.3, -r * 0.03, -r * 1.4);
          ctx.stroke();
          ctx.fillStyle = "#ffd05c";
          ctx.beginPath();
          ctx.arc(-r * 0.03, -r * 1.42, r * 0.13 + Math.sin(elapsed * 18) * 1.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255, 105, 48, 0.8)";
          ctx.beginPath();
          ctx.arc(-r * 0.03, -r * 1.42, r * 0.06, 0, Math.PI * 2);
          ctx.fill();
        }

        // 眼睛
        const eyeY = type === "green" ? -r * 0.26 : -r * 0.22;
        const eyeR = r * 0.205;
        ctx.fillStyle = "#fffdf2";
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(side * r * 0.21, eyeY, eyeR, eyeR * 1.08, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#1b1916";
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(side * r * 0.21 + r * 0.04, eyeY + r * 0.015, eyeR * 0.45, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(side * r * 0.21 + r * 0.07, eyeY - r * 0.04, eyeR * 0.15, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#1b1916";
        }

        // 怒眉
        ctx.strokeStyle = type === "yellow" ? "#4e3707" : "#2b1a12";
        ctx.lineWidth = Math.max(2, r * 0.1);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-r * 0.48, -r * 0.56);
        ctx.lineTo(-r * 0.06, -r * 0.42);
        ctx.moveTo(r * 0.48, -r * 0.56);
        ctx.lineTo(r * 0.06, -r * 0.42);
        ctx.stroke();

        // 喙
        ctx.fillStyle = type === "black" ? "#f2b52e" : "#f7a623";
        ctx.strokeStyle = "rgba(120, 62, 8, 0.38)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(r * 0.47, r * 0.04);
        ctx.lineTo(r * 0.98, r * 0.14);
        ctx.lineTo(r * 0.49, r * 0.3);
        ctx.quadraticCurveTo(r * 0.6, r * 0.16, r * 0.47, r * 0.04);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        if (type === "green") {
          ctx.fillStyle = "#e88c1d";
          ctx.beginPath();
          ctx.moveTo(r * 0.45, r * 0.22);
          ctx.lineTo(r * 0.9, r * 0.45);
          ctx.lineTo(r * 0.44, r * 0.45);
          ctx.closePath();
          ctx.fill();
        }

        // 脸颊
        if (!options.noCheek) {
          ctx.fillStyle = "rgba(255, 100, 80, 0.18)";
          for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.arc(side * r * 0.5, r * 0.32, r * 0.15, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (type === "bigred") {
          ctx.strokeStyle = "rgba(255, 235, 210, 0.45)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.88, -1.2, -0.35);
          ctx.stroke();
        }

        ctx.restore();
      }

      // ---------------- Background / scenery ----------------
      function drawCloud(x, y, scale, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = theme.cloud;
        ctx.beginPath();
        ctx.arc(-50, 0, 28, 0, Math.PI * 2);
        ctx.arc(-18, -17, 36, 0, Math.PI * 2);
        ctx.arc(25, -8, 30, 0, Math.PI * 2);
        ctx.arc(55, 8, 22, 0, Math.PI * 2);
        ctx.arc(4, 16, 38, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = theme.cloudShade;
        ctx.beginPath();
        ctx.ellipse(0, 25, 72, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 20);
        sky.addColorStop(0, theme.skyTop);
        sky.addColorStop(0.6, theme.skyMid);
        sky.addColorStop(1, theme.skyBottom);
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, WORLD.w, WORLD.h);

        const sunX = 1350;
        const sunY = 142;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 24, sunX, sunY, 210);
        sunGlow.addColorStop(0, theme.sunGlow);
        sunGlow.addColorStop(0.5, "rgba(255, 250, 220, 0.13)");
        sunGlow.addColorStop(1, "rgba(255, 250, 220, 0)");
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 210, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = theme.sun;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 52, 0, Math.PI * 2);
        ctx.fill();

        const drift = (elapsed * 2.4) % 2100;
        drawCloud(((240 + drift) % 2100) - 250, 155, 1.08, 0.62);
        drawCloud(((820 + drift * 0.66) % 2100) - 250, 230, 0.76, 0.48);
        drawCloud(((1460 + drift * 0.82) % 2100) - 250, 105, 0.92, 0.55);
        drawCloud(((1830 + drift * 0.48) % 2100) - 250, 285, 0.56, 0.38);

        // 远山
        ctx.fillStyle = theme.hillBack;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y + 4);
        ctx.lineTo(0, 648);
        ctx.bezierCurveTo(160, 565, 260, 612, 420, 570);
        ctx.bezierCurveTo(570, 526, 710, 604, 880, 560);
        ctx.bezierCurveTo(1080, 510, 1200, 600, 1390, 545);
        ctx.bezierCurveTo(1490, 516, 1550, 545, 1600, 528);
        ctx.lineTo(1600, GROUND_Y + 4);
        ctx.closePath();
        ctx.fill();

        // 近山与树林
        ctx.fillStyle = theme.hillFront;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y + 4);
        ctx.lineTo(0, 700);
        ctx.bezierCurveTo(170, 644, 330, 702, 520, 665);
        ctx.bezierCurveTo(700, 630, 820, 712, 1050, 670);
        ctx.bezierCurveTo(1230, 636, 1390, 702, 1600, 660);
        ctx.lineTo(1600, GROUND_Y + 4);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = theme.tree;
        const trees = [
          [115, 688, 1.1], [165, 702, 0.8], [260, 680, 0.65],
          [1420, 684, 0.72], [1500, 696, 0.95], [1565, 672, 0.6]
        ];
        for (const [x, y, s] of trees) {
          ctx.globalAlpha = 0.42;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - 24 * s, y + 48 * s);
          ctx.lineTo(x + 24 * s, y + 48 * s);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(x, y - 16 * s);
          ctx.lineTo(x - 18 * s, y + 28 * s);
          ctx.lineTo(x + 18 * s, y + 28 * s);
          ctx.closePath();
          ctx.fill();
          ctx.fillRect(x - 2.5 * s, y + 44 * s, 5 * s, 18 * s);
          ctx.globalAlpha = 1;
        }

        // 地面
        const dirt = ctx.createLinearGradient(0, GROUND_Y, 0, WORLD.h);
        dirt.addColorStop(0, theme.dirtLight);
        dirt.addColorStop(0.26, theme.dirt);
        dirt.addColorStop(1, theme.dirtDark);
        ctx.fillStyle = dirt;
        ctx.fillRect(0, GROUND_Y, WORLD.w, WORLD.h - GROUND_Y);

        ctx.fillStyle = theme.grass;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(WORLD.w, GROUND_Y);
        ctx.lineTo(WORLD.w, GROUND_Y + 48);
        for (let x = WORLD.w; x >= 0; x -= 32) {
          ctx.quadraticCurveTo(x - 16, GROUND_Y + 48 + Math.sin(x * 0.045) * 8, x - 32, GROUND_Y + 48);
        }
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = theme.grassDark;
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y + 2);
        ctx.lineTo(WORLD.w, GROUND_Y + 2);
        ctx.stroke();

        // 草叶与小花
        for (let i = 0; i < 66; i += 1) {
          const x = 12 + i * 24.4;
          const h = 8 + hash(i * 4.7) * 19;
          ctx.strokeStyle = i % 3 === 0 ? theme.grassLight : theme.grassDark;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, GROUND_Y + 4);
          ctx.quadraticCurveTo(x - 4, GROUND_Y - h * 0.5, x - 7, GROUND_Y - h);
          ctx.moveTo(x + 2, GROUND_Y + 4);
          ctx.quadraticCurveTo(x + 6, GROUND_Y - h * 0.4, x + 10, GROUND_Y - h * 0.8);
          ctx.stroke();
          if (i % 11 === 4) {
            ctx.fillStyle = i % 22 === 4 ? "#fff4bd" : "#ff9eae";
            ctx.beginPath();
            ctx.arc(x, GROUND_Y - h - 6, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#f3b22b";
            ctx.beginPath();
            ctx.arc(x, GROUND_Y - h - 6, 1.6, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        for (let i = 0; i < 38; i += 1) {
          const x = 30 + hash(i * 7.3) * 1540;
          const y = 805 + hash(i * 3.9 + 8) * 78;
          ctx.fillStyle = i % 2 === 0 ? "rgba(255,255,255,0.12)" : "rgba(49,28,12,0.13)";
          ctx.beginPath();
          ctx.ellipse(x, y, 2 + hash(i * 9.1) * 4, 1.4 + hash(i * 5.5) * 2.5, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        const shade = ctx.createLinearGradient(0, GROUND_Y + 44, 0, GROUND_Y + 120);
        shade.addColorStop(0, "rgba(29, 49, 20, 0)");
        shade.addColorStop(1, "rgba(29, 49, 20, 0.14)");
        ctx.fillStyle = shade;
        ctx.fillRect(0, GROUND_Y + 44, WORLD.w, 90);
      }

      // ---------------- Slingshot / birds ----------------
      function loadedBirdPosition() {
        if (drag) return { x: drag.x, y: drag.y };
        return {
          x: ANCHOR.x,
          y: ANCHOR.y + Math.sin(elapsed * 2.3) * 2.6
        };
      }

      function drawSlingBack(loaded) {
        const leftTip = { x: 211, y: 574 };
        const rightTip = { x: 281, y: 574 };
        const base = { x: 246, y: 762 };

        ctx.save();
        ctx.fillStyle = "rgba(48, 42, 22, 0.2)";
        ctx.beginPath();
        ctx.ellipse(246, 765, 62, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#5e371b";
        ctx.lineWidth = 26;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(base.x, base.y);
        ctx.lineTo(base.x, 655);
        ctx.stroke();

        ctx.strokeStyle = "#9a622d";
        ctx.lineWidth = 16;
        ctx.beginPath();
        ctx.moveTo(base.x, base.y);
        ctx.lineTo(base.x, 658);
        ctx.stroke();

        ctx.strokeStyle = "#4c2b13";
        ctx.lineWidth = 22;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(base.x, 660);
        ctx.lineTo(leftTip.x, leftTip.y);
        ctx.moveTo(base.x, 660);
        ctx.lineTo(rightTip.x, rightTip.y);
        ctx.stroke();

        ctx.strokeStyle = "#a56a31";
        ctx.lineWidth = 13;
        ctx.beginPath();
        ctx.moveTo(base.x, 660);
        ctx.lineTo(leftTip.x, leftTip.y);
        ctx.moveTo(base.x, 660);
        ctx.lineTo(rightTip.x, rightTip.y);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255, 213, 150, 0.45)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(base.x - 2, 740);
        ctx.lineTo(base.x - 2, 670);
        ctx.stroke();

        ctx.fillStyle = "rgba(76, 43, 19, 0.4)";
        ctx.beginPath();
        ctx.arc(leftTip.x, leftTip.y, 8, 0, Math.PI * 2);
        ctx.arc(rightTip.x, rightTip.y, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#672b22";
        ctx.lineWidth = 9;
        ctx.lineCap = "round";
        if (loaded) {
          ctx.beginPath();
          ctx.moveTo(leftTip.x, leftTip.y);
          ctx.lineTo(loaded.x - 10, loaded.y);
          ctx.stroke();
          ctx.strokeStyle = "rgba(255, 142, 113, 0.35)";
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(leftTip.x, leftTip.y);
          ctx.lineTo(loaded.x - 10, loaded.y);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.moveTo(leftTip.x, leftTip.y);
          ctx.quadraticCurveTo(246, 612, 246, 648);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawSlingFront(loaded) {
        const rightTip = { x: 281, y: 574 };
        ctx.save();
        ctx.strokeStyle = "#672b22";
        ctx.lineWidth = 9;
        ctx.lineCap = "round";
        if (loaded) {
          ctx.beginPath();
          ctx.moveTo(rightTip.x, rightTip.y);
          ctx.lineTo(loaded.x + 10, loaded.y);
          ctx.stroke();
          ctx.strokeStyle = "rgba(255, 142, 113, 0.35)";
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(rightTip.x, rightTip.y);
          ctx.lineTo(loaded.x + 10, loaded.y);
          ctx.stroke();

          ctx.strokeStyle = "rgba(63, 27, 15, 0.8)";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(loaded.x - 13, loaded.y - 7);
          ctx.lineTo(loaded.x + 11, loaded.y - 3);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.moveTo(rightTip.x, rightTip.y);
          ctx.quadraticCurveTo(246, 612, 246, 648);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawTrajectory(origin, vx, vy) {
        const def = BIRDS[currentBirdType];
        if (!def) return;
        const gravity = engine ? engine.gravity.y * engine.gravity.scale * STEP * STEP : 0.2917;
        let x = origin.x;
        let y = origin.y;
        let speedX = vx;
        let speedY = vy;
        let hit = null;
        ctx.save();
        for (let i = 0; i < 96; i += 1) {
          speedX *= 1 - 0.0017;
          speedY *= 1 - 0.0017;
          speedY += gravity;
          x += speedX;
          y += speedY;

          if (i % 3 === 0) {
            const alpha = clamp(0.92 - i / 110, 0.12, 0.92);
            ctx.fillStyle = `rgba(255,255,245,${alpha})`;
            ctx.shadowColor = "rgba(37, 57, 58, 0.35)";
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.arc(x, y, clamp(4.2 - i * 0.026, 1.7, 4.2), 0, Math.PI * 2);
            ctx.fill();
          }

          if (y > GROUND_Y || x > WORLD.w + 60) {
            hit = { x, y: Math.min(y, GROUND_Y) };
            break;
          }
          for (const block of blocks) {
            if (block.plugin.dead) continue;
            const bounds = block.bounds;
            if (x > bounds.min.x && x < bounds.max.x && y > bounds.min.y && y < bounds.max.y) {
              hit = { x, y };
              break;
            }
          }
          if (hit) break;
        }
        ctx.shadowBlur = 0;
        if (hit && hit.y < GROUND_Y - 1) {
          ctx.strokeStyle = "rgba(255,255,232,0.76)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(hit.x, hit.y, 9, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(hit.x, hit.y, 15, 0, Math.PI * 2);
          ctx.globalAlpha = 0.38;
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawTrails() {
        for (const entity of [...shotBirds, ...eggs]) {
          if (entity.plugin.dead) continue;
          const trail = entity.plugin.trail;
          if (!trail || trail.length < 2) continue;
          const color = entity.plugin.kind === "egg" ? "#fff8d9" : BIRDS[entity.plugin.type].color;
          ctx.save();
          ctx.strokeStyle = color;
          ctx.lineCap = "round";
          for (let i = 1; i < trail.length; i += 1) {
            const t = i / trail.length;
            ctx.globalAlpha = t * 0.24;
            ctx.lineWidth = 1.5 + t * 4.5;
            ctx.beginPath();
            ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
            ctx.lineTo(trail[i].x, trail[i].y);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawEgg(egg) {
        ctx.save();
        ctx.translate(egg.position.x, egg.position.y);
        ctx.rotate(egg.angle);
        const gradient = ctx.createRadialGradient(-4, -5, 2, 0, 0, 14);
        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(0.65, "#f5f2e7");
        gradient.addColorStop(1, "#cfc8b7");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(0, 0, 11, 13, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(114, 104, 84, 0.48)";
        ctx.lineWidth = 1.4;
        ctx.stroke();
        ctx.fillStyle = "rgba(139, 124, 98, 0.45)";
        ctx.beginPath();
        ctx.arc(-3, -4, 1.4, 0, Math.PI * 2);
        ctx.arc(4, 3, 1.7, 0, Math.PI * 2);
        ctx.arc(-1, 5, 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // ---------------- Scene render ----------------
      function drawParticles() {
        for (const p of particles) {
          const alpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          if (p.glow) {
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 14;
          }
          if (p.shape === "rect") {
            ctx.fillRect(-p.size * 0.5, -p.size * 0.28, p.size, p.size * 0.56);
          } else if (p.shape === "square") {
            ctx.fillRect(-p.size * 0.45, -p.size * 0.45, p.size * 0.9, p.size * 0.9);
          } else if (p.shape === "triangle") {
            ctx.beginPath();
            ctx.moveTo(0, -p.size * 0.6);
            ctx.lineTo(p.size * 0.55, p.size * 0.45);
            ctx.lineTo(-p.size * 0.55, p.size * 0.45);
            ctx.closePath();
            ctx.fill();
          } else if (p.shape === "star") {
            ctx.beginPath();
            for (let i = 0; i < 8; i += 1) {
              const angle = (i / 8) * Math.PI * 2;
              const radius = i % 2 === 0 ? p.size : p.size * 0.38;
              const px = Math.cos(angle) * radius;
              const py = Math.sin(angle) * radius;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      function drawFloats() {
        for (const f of floatTexts) {
          const alpha = clamp(f.life / f.maxLife, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = `900 ${f.size}px "Arial Black", "PingFang SC", sans-serif`;
          ctx.lineWidth = 4;
          ctx.strokeStyle = "rgba(51, 27, 10, 0.55)";
          ctx.strokeText(f.text, f.x, f.y);
          ctx.fillStyle = f.color;
          ctx.fillText(f.text, f.x, f.y);
          ctx.restore();
        }
      }

      function drawShockwaves() {
        for (const s of shockwaves) {
          const alpha = clamp(s.life / s.maxLife, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = s.color + (alpha * 0.78) + ")";
          ctx.lineWidth = Math.max(1, 10 * alpha);
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255," + alpha * 0.5 + ")";
          ctx.lineWidth = Math.max(1, 3 * alpha);
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 0.78, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      function render() {
        const dpr = view.dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#0a2027";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const shakeX = shake > 0.05 ? (Math.random() * 2 - 1) * shake : 0;
        const shakeY = shake > 0.05 ? (Math.random() * 2 - 1) * shake : 0;
        ctx.setTransform(dpr * view.scale, 0, 0, dpr * view.scale, dpr * view.ox, dpr * view.oy);
        ctx.translate(shakeX, shakeY);

        drawBackground();

        const loaded = currentBirdType && state === "playing" && !shotActive ? loadedBirdPosition() : null;
        drawSlingBack(loaded);

        if (loaded) {
          ctx.save();
          const face = drag
            ? Math.atan2(ANCHOR.y - drag.y, ANCHOR.x - drag.x)
            : Math.sin(elapsed * 2) * 0.04;
          drawBird(currentBirdType, loaded.x, loaded.y, BIRDS[currentBirdType].radius, face);
          if (drag && aimPower > 0.05) {
            ctx.strokeStyle = `rgba(255, 231, 142, ${0.25 + aimPower * 0.4})`;
            ctx.lineWidth = 2;
            ctx.setLineDash([7, 8]);
            ctx.beginPath();
            ctx.moveTo(loaded.x, loaded.y);
            ctx.lineTo(ANCHOR.x, ANCHOR.y);
            ctx.stroke();
            ctx.setLineDash([]);
          }
          ctx.restore();
        }

        for (const block of blocks) {
          drawBlock(block);
        }
        for (const tnt of tnts) {
          drawTNT(tnt);
        }
        for (const pig of pigs) {
          drawPig(pig);
        }

        drawTrails();

        for (const bird of shotBirds) {
          if (bird.plugin.dead) continue;
          const def = BIRDS[bird.plugin.type];
          drawBird(bird.plugin.type, bird.position.x, bird.position.y, bird.plugin.radius, bird.plugin.faceAngle);
        }
        for (const egg of eggs) {
          if (!egg.plugin.dead) drawEgg(egg);
        }

        drawSlingFront(loaded);

        if (drag && currentBirdType) {
          const vx = (ANCHOR.x - drag.x) * PULL_SPEED;
          const vy = (ANCHOR.y - drag.y) * PULL_SPEED;
          drawTrajectory({ x: drag.x, y: drag.y }, vx, vy);
        }

        drawShockwaves();
        drawParticles();
        drawFloats();

        ctx.restore();

        if (flash > 0.01) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = `rgba(255, 244, 192, ${Math.min(0.55, flash)})`;
          ctx.fillRect(0, 0, view.w, view.h);
        }
      }

      // ---------------- Main loop ----------------
      function updateVisuals(dt) {
        elapsed += dt;
        shake = Math.max(0, shake - dt * 26);
        flash = Math.max(0, flash - dt * 1.65);
        updateParticles(dt);
      }

      function loop(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000));
        lastFrame = now;
        if (state === "playing" && engine) {
          accum += dt * 1000;
          let steps = 0;
          while (accum >= STEP && steps < 5) {
            Engine.update(engine, STEP);
            updateGame(STEP_SECONDS);
            accum -= STEP;
            steps += 1;
            if (state !== "playing") break;
          }
          if (steps === 5) accum = 0;
        }
        updateVisuals(dt);
        render();
        requestAnimationFrame(loop);
      }

      function resizeCanvas() {
        const rect = stage.getBoundingClientRect();
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        view.dpr = dpr;
        view.w = rect.width;
        view.h = rect.height;
        view.scale = Math.min(rect.width / WORLD.w, rect.height / WORLD.h);
        view.ox = (rect.width - WORLD.w * view.scale) / 2;
        view.oy = (rect.height - WORLD.h * view.scale) / 2;
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));
      }

      function syncRotateHint() {
        if (localStorage.getItem("ab_rotate_skip") === "1") {
          rotateOverlay.classList.remove("show");
          return;
        }
        const portrait = window.matchMedia("(orientation: portrait) and (max-width: 900px)").matches;
        rotateOverlay.classList.toggle("show", portrait);
      }

      function init() {
        buildMenu();
        buildGuide();
        updateSoundButton();
        resizeCanvas();
        syncRotateHint();

        canvas.addEventListener("pointerdown", onPointerDown);
        canvas.addEventListener("pointermove", onPointerMove);
        canvas.addEventListener("pointerup", onPointerUp);
        canvas.addEventListener("pointercancel", onPointerCancel);
        window.addEventListener("resize", () => {
          resizeCanvas();
          syncRotateHint();
        });
        window.addEventListener("orientationchange", () => {
          setTimeout(() => {
            resizeCanvas();
            syncRotateHint();
          }, 200);
        });
        if (window.ResizeObserver) {
          new ResizeObserver(resizeCanvas).observe(stage);
        }

        lastFrame = performance.now();
        requestAnimationFrame(loop);
      }

      init();
    })();
  </script>
