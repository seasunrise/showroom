<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12323b">
  <title>愤怒的小鸟 · 猪猪堡垒</title>
  <style>
    :root {
      --ink: #35200f;
      --ink-soft: #6c4a2c;
      --cream: #fff6da;
      --cream-2: #ffe9b7;
      --gold: #ffc53d;
      --red: #d94337;
      --green: #6db33f;
      --shadow: rgba(25, 13, 5, 0.34);
      --ui: clamp(10px, 1.05vw, 16px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #102b33;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 3px solid #2d8ecf;
      outline-offset: 3px;
    }

    #stage {
      position: relative;
      width: min(100vw, calc(100dvh * 16 / 9));
      height: min(100dvh, calc(100vw * 9 / 16));
      max-width: 1600px;
      max-height: 900px;
      overflow: hidden;
      background: #90d8ed;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.45);
      isolation: isolate;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    /* ---------------- HUD ---------------- */
    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      font-size: var(--ui);
    }

    .hud.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    .hud-left {
      position: absolute;
      top: 2.2%;
      left: 1.6%;
      display: flex;
      flex-direction: column;
      gap: 0.7em;
      align-items: flex-start;
    }

    .stat-panel {
      display: flex;
      align-items: stretch;
      gap: 0.2em;
      padding: 0.55em 0.85em 0.55em 0.55em;
      border: 0.2em solid #6b421e;
      border-radius: 1em;
      background: linear-gradient(180deg, #fffdf2 0%, #ffe9b8 100%);
      box-shadow: 0 0.35em 0 #4d2d13, 0 0.8em 1.6em rgba(24, 13, 4, 0.25), inset 0 0.14em 0 #fff;
    }

    .level-chip {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 5.4em;
      padding: 0 0.7em;
      border-right: 0.12em dashed rgba(97, 61, 31, 0.28);
    }

    .level-chip span {
      color: #9a6431;
      font-size: 0.62em;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .level-chip strong {
      margin-top: 0.1em;
      color: #40240f;
      font-size: 1.05em;
      line-height: 1.15;
      font-weight: 900;
    }

    .stat {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 4.4em;
      padding: 0 0.65em;
    }

    .stat-label {
      color: #9a6431;
      font-size: 0.62em;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .stat strong {
      color: #35200f;
      font-family: "Arial Black", "PingFang SC", sans-serif;
      font-size: 1.22em;
      line-height: 1.12;
      letter-spacing: 0.02em;
    }

    .stat.pigs strong {
      color: #4e9a28;
    }

    .bird-strip {
      display: flex;
      gap: 0.42em;
      align-items: center;
      min-height: 2.7em;
      padding: 0.36em 0.55em;
      border: 0.16em solid rgba(65, 38, 16, 0.78);
      border-radius: 1.2em;
      background: rgba(255, 248, 224, 0.9);
      box-shadow: 0 0.28em 0 rgba(65, 38, 16, 0.75), 0 0.5em 1em rgba(24, 13, 4, 0.18);
      backdrop-filter: blur(4px);
    }

    .bird-strip-label {
      padding: 0 0.25em 0 0.2em;
      color: #8a5a2b;
      font-size: 0.62em;
      font-weight: 900;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .bird-token {
      position: relative;
      display: grid;
      place-items: center;
      width: 2.1em;
      height: 2.1em;
      border-radius: 50%;
      border: 0.14em solid rgba(60, 30, 12, 0.45);
      color: #fff;
      font-size: 0.72em;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      box-shadow: inset 0 0.2em 0.25em rgba(255, 255, 255, 0.42), 0 0.14em 0 rgba(45, 26, 12, 0.4);
    }

    .bird-token.current {
      width: 2.55em;
      height: 2.55em;
      outline: 0.16em solid #fff3b8;
      box-shadow: 0 0 0 0.28em rgba(255, 197, 61, 0.55), inset 0 0.2em 0.25em rgba(255, 255, 255, 0.42);
    }

    .bird-token.current::after {
      content: "";
      position: absolute;
      bottom: -0.72em;
      width: 0.4em;
      height: 0.4em;
      border-radius: 50%;
      background: #ffc53d;
      box-shadow: 0 0 0 0.18em rgba(255, 197, 61, 0.25);
    }

    .b-red {
      background: radial-gradient(circle at 35% 28%, #ff8a79, #d94337 62%, #8e211d);
    }

    .b-blue {
      background: radial-gradient(circle at 35% 28%, #9ceaff, #43afe3 62%, #176793);
    }

    .b-yellow {
      background: radial-gradient(circle at 35% 28%, #fff2a5, #f0be27 62%, #ad7d10);
      color: #4f3600;
      text-shadow: none;
    }

    .b-black {
      background: radial-gradient(circle at 35% 28%, #727986, #2d323b 60%, #101216);
    }

    .b-white {
      background: radial-gradient(circle at 35% 28%, #ffffff, #ede9db 62%, #b8b1a0);
      color: #705127;
      text-shadow: none;
    }

    .b-bigred {
      background: radial-gradient(circle at 35% 28%, #f1786b, #bb332b 62%, #701813);
    }

    .b-silver {
      background: radial-gradient(circle at 35% 28%, #f2f4f8, #b7bdc9 60%, #6e7482);
    }

    .b-green {
      background: radial-gradient(circle at 35% 28%, #b7ef87, #63b94a 62%, #2e7425);
    }

    .hud-right {
      position: absolute;
      top: 2.2%;
      right: 1.6%;
      display: flex;
      gap: 0.5em;
      pointer-events: auto;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 2.6em;
      height: 2.6em;
      border: 0.16em solid #5e3a1a;
      border-radius: 50%;
      background: linear-gradient(180deg, #fffcef, #ffe6ad);
      box-shadow: 0 0.28em 0 #4e2e12, 0 0.5em 1em rgba(24, 13, 4, 0.25), inset 0 0.12em 0 #fff;
      color: #54351a;
      font-size: 0.95em;
      font-weight: 900;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .icon-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .icon-btn:active {
      transform: translateY(0.16em);
      box-shadow: 0 0.1em 0 #4e2e12, inset 0 0.12em 0 #fff;
    }

    .icon-btn .off {
      display: none;
    }

    .icon-btn.muted .on {
      display: none;
    }

    .icon-btn.muted .off {
      display: block;
    }

    .tip {
      position: absolute;
      left: 50%;
      bottom: 2.2%;
      transform: translateX(-50%);
      padding: 0.62em 1.15em;
      border-radius: 999px;
      background: rgba(31, 24, 18, 0.72);
      color: #fff8dc;
      font-size: 0.78em;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      backdrop-filter: blur(5px);
      box-shadow: 0 0.25em 0.8em rgba(0, 0, 0, 0.18);
    }

    .tip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-0.15em);
    }

    .skill-btn {
      position: absolute;
      left: 50%;
      bottom: 7.2%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.65em;
      padding: 0.55em 1.15em 0.55em 0.6em;
      border: 0.18em solid #7c4113;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffd867, #ffab1f);
      box-shadow: 0 0.32em 0 #9d5a12, 0 0.7em 1.5em rgba(63, 31, 4, 0.3), inset 0 0.15em 0 #fff8ba;
      color: #4a2a08;
      pointer-events: auto;
      animation: skillPulse 1.25s ease-in-out infinite;
    }

    .skill-btn:hover {
      filter: brightness(1.05);
    }

    .skill-btn:active {
      transform: translateX(-50%) translateY(0.2em);
      box-shadow: 0 0.08em 0 #9d5a12, inset 0 0.15em 0 #fff8ba;
    }

    .skill-key {
      display: grid;
      place-items: center;
      width: 2.1em;
      height: 2.1em;
      border-radius: 50%;
      background: #fff8d5;
      color: #b4670c;
      font-weight: 900;
      font-size: 1.05em;
      box-shadow: inset 0 -0.12em 0 #e2bd6b;
    }

    .skill-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.15;
    }

    .skill-copy b {
      font-size: 0.76em;
      letter-spacing: 0.04em;
    }

    .skill-copy small {
      font-size: 0.66em;
      font-weight: 800;
      opacity: 0.72;
    }

    @keyframes skillPulse {

      0%,
      100% {
        filter: drop-shadow(0 0 0 rgba(255, 211, 92, 0));
      }

      50% {
        filter: drop-shadow(0 0 0.85em rgba(255, 211, 92, 0.85));
      }
    }

    .level-toast {
      position: absolute;
      left: 50%;
      top: 13%;
      transform: translate(-50%, -1em);
      min-width: 15em;
      padding: 0.85em 1.6em 1em;
      border: 0.2em solid rgba(72, 41, 17, 0.82);
      border-radius: 1.1em;
      background: linear-gradient(180deg, #fffdf4, #ffe8b2);
      box-shadow: 0 0.45em 0 #4e2e12, 0 1.2em 2.5em rgba(28, 14, 3, 0.3);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.2, 1.3, 0.4, 1);
    }

    .level-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .level-toast small {
      display: block;
      color: #a06b30;
      font-size: 0.65em;
      font-weight: 900;
      letter-spacing: 0.22em;
    }

    .level-toast strong {
      display: block;
      margin-top: 0.2em;
      font-size: 1.45em;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .level-toast em {
      display: block;
      margin-top: 0.2em;
      color: #8b6237;
      font-size: 0.7em;
      font-style: normal;
      font-weight: 700;
    }

    /* ---------------- Screens ---------------- */
    .screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.2%;
      background:
        radial-gradient(circle at 76% 16%, rgba(255, 239, 160, 0.24), transparent 34%),
        radial-gradient(circle at 18% 84%, rgba(27, 117, 94, 0.28), transparent 40%),
        rgba(13, 44, 52, 0.42);
      backdrop-filter: blur(4px) saturate(0.95);
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      overflow: hidden;
    }

    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .menu-card {
      position: relative;
      width: min(100%, 64em);
      max-height: 96%;
      overflow: auto;
      padding: clamp(1em, 2.2vw, 2.2em);
      border: 0.22em solid #71451f;
      border-radius: 1.8em;
      background:
        radial-gradient(circle at 88% -10%, rgba(255, 214, 94, 0.5), transparent 32%),
        linear-gradient(145deg, #fffdf3 0%, #fff1c9 54%, #ffe2a1 100%);
      box-shadow: 0 0.9em 0 #4a2b12, 0 2.2em 6em rgba(0, 0, 0, 0.42), inset 0 0.25em 0 rgba(255, 255, 255, 0.9);
      scrollbar-width: thin;
      scrollbar-color: #c38c4d transparent;
    }

    .menu-card::before {
      content: "";
      position: absolute;
      right: -4em;
      top: -5em;
      width: 16em;
      height: 16em;
      border-radius: 50%;
      border: 1.4em solid rgba(255, 255, 255, 0.22);
      pointer-events: none;
    }

    .menu-layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(17em, 0.86fr) minmax(22em, 1.14fr);
      gap: clamp(1.2em, 2.5vw, 2.4em);
      align-items: center;
    }

    .brand-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      color: #9a632c;
      font-size: 0.66em;
      font-weight: 900;
      letter-spacing: 0.28em;
    }

    .brand-kicker::before {
      content: "";
      width: 1.9em;
      height: 0.28em;
      border-radius: 99px;
      background: #d94337;
    }

    .brand h1 {
      margin: 0.18em 0 0;
      font-family: "Arial Black", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: clamp(2.4em, 5vw, 4.5em);
      font-weight: 900;
      line-height: 0.98;
      letter-spacing: -0.03em;
      white-space: nowrap;
      color: #c33125;
      text-shadow:
        0 0.035em 0 #7e1a14,
        0 0.09em 0 #5b120d,
        0 0.12em 0.2em rgba(66, 23, 10, 0.28);
    }

    .brand h1 span {
      color: #f0b51f;
      text-shadow:
        0 0.035em 0 #98610b,
        0 0.09em 0 #6b4208,
        0 0.12em 0.2em rgba(66, 23, 10, 0.24);
    }

    .brand-subtitle {
      margin-top: 0.7em;
      color: #543517;
      font-size: clamp(0.88em, 1.5vw, 1.1em);
      font-weight: 900;
      letter-spacing: 0.18em;
    }

    .brand-desc {
      max-width: 27em;
      margin: 0.9em 0 0;
      color: #78552f;
      font-size: 0.82em;
      line-height: 1.75;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65em;
      margin-top: 1.35em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      min-height: 2.7em;
      padding: 0.62em 1.25em;
      border: 0.16em solid rgba(76, 41, 13, 0.8);
      border-radius: 999px;
      font-size: 0.82em;
      font-weight: 900;
      letter-spacing: 0.04em;
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
    }

    .btn-primary {
      background: linear-gradient(180deg, #ffda66, #ffad1e);
      color: #4a2908;
      box-shadow: 0 0.32em 0 #9d5a12, 0 0.7em 1.4em rgba(99, 51, 5, 0.22), inset 0 0.14em 0 #fff7bf;
    }

    .btn-danger {
      background: linear-gradient(180deg, #f05c4d, #c22d25);
      color: #fff9ec;
      box-shadow: 0 0.32em 0 #7d1813, 0 0.7em 1.4em rgba(88, 18, 12, 0.24), inset 0 0.14em 0 rgba(255, 255, 255, 0.28);
    }

    .btn-ghost {
      background: linear-gradient(180deg, #fffef7, #f3dfb4);
      color: #65431e;
      box-shadow: 0 0.28em 0 #a47a45, inset 0 0.14em 0 #fff;
    }

    .btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0.16em);
      box-shadow: 0 0.08em 0 rgba(80, 40, 10, 0.7), inset 0 0.14em 0 rgba(255, 255, 255, 0.3);
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75em;
    }

    .level-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 8.2em;
      padding: 0.9em 1em 0.85em;
      overflow: hidden;
      border: 0.16em solid rgba(78, 45, 20, 0.75);
      border-radius: 1.15em;
      background:
        radial-gradient(circle at 100% 0, var(--tint-soft, rgba(255, 255, 255, 0.55)), transparent 52%),
        linear-gradient(145deg, #fffdf6, var(--tint, #ffe7b0));
      box-shadow: 0 0.28em 0 rgba(78, 45, 20, 0.7), inset 0 0.16em 0 rgba(255, 255, 255, 0.78);
      text-align: left;
      transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
    }

    .level-card:hover {
      transform: translateY(-0.22em);
      filter: brightness(1.03);
      box-shadow: 0 0.52em 0 rgba(78, 45, 20, 0.7), 0 0.8em 1.5em rgba(60, 31, 8, 0.16), inset 0 0.16em 0 rgba(255, 255, 255, 0.78);
    }

    .level-card:active {
      transform: translateY(0.08em);
      box-shadow: 0 0.1em 0 rgba(78, 45, 20, 0.7);
    }

    .level-card .level-no {
      position: absolute;
      right: 0.5em;
      top: 0.1em;
      color: rgba(88, 55, 24, 0.22);
      font-family: "Arial Black", sans-serif;
      font-size: 2.8em;
      line-height: 1;
      font-weight: 900;
    }

    .level-card .level-name {
      position: relative;
      z-index: 1;
      color: #40230e;
      font-size: 1.02em;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .level-card .level-desc {
      position: relative;
      z-index: 1;
      margin-top: 0.34em;
      color: #8b6338;
      font-size: 0.68em;
      font-weight: 700;
      line-height: 1.45;
    }

    .level-card .level-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: auto;
      padding-top: 0.65em;
      gap: 0.5em;
    }

    .level-stars {
      color: rgba(105, 76, 37, 0.22);
      font-size: 0.88em;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .level-stars .lit {
      color: #f2b31d;
      text-shadow: 0 1px 0 #8f5c0b;
    }

    .mini-birds {
      display: flex;
      gap: 0.16em;
    }

    .mini-bird {
      width: 0.8em;
      height: 0.8em;
      border: 0.08em solid rgba(62, 34, 10, 0.35);
      border-radius: 50%;
    }

    .menu-foot {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1em;
      margin-top: 1.3em;
      padding-top: 1em;
      border-top: 0.12em dashed rgba(109, 72, 36, 0.25);
      color: #8a633b;
      font-size: 0.68em;
      font-weight: 700;
    }

    .keys {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7em;
      align-items: center;
    }

    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 1.7em;
      height: 1.7em;
      margin-right: 0.18em;
      padding: 0 0.3em;
      border: 1px solid #b49060;
      border-bottom-width: 2px;
      border-radius: 0.38em;
      background: #fffaf0;
      color: #6a4a28;
      font-family: inherit;
      font-size: 0.9em;
      font-weight: 900;
    }

    /* ---------------- Guide ---------------- */
    .guide-card {
      width: min(100%, 55em);
      max-height: 92%;
      overflow: auto;
      padding: clamp(1.2em, 2.2vw, 2em);
      border: 0.22em solid #71451f;
      border-radius: 1.7em;
      background: linear-gradient(150deg, #fffdf5, #ffedc2);
      box-shadow: 0 0.9em 0 #4a2b12, 0 2em 5em rgba(0, 0, 0, 0.4), inset 0 0.2em 0 #fff;
    }

    .guide-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1em;
      margin-bottom: 1.25em;
    }

    .guide-head h2 {
      margin: 0;
      font-size: 1.6em;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .guide-head p {
      margin: 0.35em 0 0;
      color: #8b6338;
      font-size: 0.76em;
      font-weight: 700;
    }

    .close-btn {
      flex: none;
      width: 2.4em;
      height: 2.4em;
      border: 0.14em solid #6e431d;
      border-radius: 50%;
      background: #fff8e5;
      box-shadow: 0 0.22em 0 #93632f;
      font-size: 0.9em;
      font-weight: 900;
    }

    .guide-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.7em;
    }

    .guide-item {
      display: flex;
      gap: 0.8em;
      padding: 0.8em;
      border: 0.12em solid rgba(105, 67, 31, 0.2);
      border-radius: 1em;

      border-radius: 1.7em;

      text-align: center;

      font-weight: 900;
      letter-spacing: 0.26em;

      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .result-card .result-sub {
      margin: 0.5em 0 0;
      color: #805b33;
      font-size: 0.78em;
      font-weight: 700;
    }

    .star-row {
      display: flex;
      justify-content: center;
      gap: 0.35em;
      margin: 0.8em 0 0.6em;
      font-size: clamp(2em, 5vw, 3.4em);
      line-height: 1;
    }

      display: inline-block;
      color: rgba(112, 75, 29, 0.2);
      text-shadow: 0 0.06em 0 rgba(255, 255, 255, 0.5);

    }

      color: #ffc531;
      text-shadow: 0 0.06em 0 #a36b0c, 0 0.2em 0.35em rgba(140, 87, 6, 0.3);
      transform: scale(1) rotate(0);
      opacity: 1;
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.45em;
      margin-top: 1em;
      padding: 0.9em;
      border: 0.12em dashed rgba(113, 72, 34, 0.25);
      border-radius: 0.9em;
      background: rgba(255, 255, 255, 0.36);

      font-weight: 900;

    .result-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.55em;
      margin-top: 1.2em;
    }

    /* ---------------- Rotate hint ---------------- */
    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 22%, rgba(255, 224, 130, 0.18), transparent 35%),
        #0e2b32;
      color: #fff6da;
      text-align: center;
    }

    #rotateOverlay.show {
      display: flex;
    }

    .rotate-box {
      max-width: 320px;
    }

    .rotate-phone {
      width: 52px;
      height: 84px;
      margin: 0 auto 24px;
      border: 4px solid #ffcf4d;
      border-radius: 12px;
      box-shadow: 0 0 0 8px rgba(255, 207, 77, 0.1);
      animation: rotatePhone 2.2s ease-in-out infinite;
    }

    .rotate-phone::after {
      content: "";
      display: block;
      width: 7px;
      height: 7px;
      margin: 65px auto 0;
      border-radius: 50%;
      background: #ffcf4d;
    }

    @keyframes rotatePhone {

      0%,
      22% {
        transform: rotate(0deg);
      }

      52%,
      78% {
        transform: rotate(90deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    .rotate-box h2 {
      margin: 0;
      font-size: 20px;
    }

    .rotate-box p {
      margin: 8px 0 18px;
      color: rgba(255, 246, 218, 0.66);
      font-size: 13px;
      line-height: 1.6;
    }

    .rotate-box button {
      padding: 9px 18px;
      border: 1px solid rgba(255, 246, 218, 0.3);
      border-radius: 999px;
      background: rgba(255, 246, 218, 0.1);
      color: #fff6da;
      font-size: 12px;
      font-weight: 700;
    }

    /* ---------------- Responsive ---------------- */
    @media (max-width: 860px) {
      .menu-layout {
        grid-template-columns: 1fr;
        gap: 1.2em;
      }

      .brand h1 {
        font-size: clamp(2.2em, 8vw, 3.6em);
      }

      .menu-card {
        max-height: 98%;
      }
    }

    @media (max-height: 520px) {
      #stage {
        width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100dvh, calc(100vw * 9 / 16));
      }

      .menu-card {
        padding: 1em 1.3em;
        border-radius: 1.2em;
      }

      .brand h1 {

      }

      .brand-desc {

      }

      .quick-actions {

      }

      .level-card {

      }

      .menu-foot {
        margin-top: 0.7em;
        padding-top: 0.6em;
      }

      .guide-item {
        padding: 0.6em;
      }

      .guide-card {
        max-height: 96%;
        padding: 1em;
      }
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #rotateOverlay.show {
        display: flex;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

      // ---------------- Audio ----------------
      function ensureAudio() {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioCtx = new AudioCtx();
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      }

      function tone(freq, duration, type = "sine", volume = 0.05, slide = 0) {
        if (!soundOn) return;
        ensureAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(Math.max(30, freq), now);
        if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), now + duration);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      function noiseBurst(duration = 0.2, volume = 0.06, cutoff = 900, type = "lowpass") {
        if (!soundOn) return;
        ensureAudio();
        if (!audioCtx) return;
        const length = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
        const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i += 1) {
          const fade = 1 - i / length;
          data[i] = (Math.random() * 2 - 1) * fade * fade;
        }
        const source = audioCtx.createBufferSource();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        filter.type = type;
        filter.frequency.value = cutoff;
        gain.gain.value = volume;
        source.buffer = buffer;
        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        source.start();
      }

      function playSound(name) {
        if (!soundOn) return;
        const now = performance.now();
        const gaps = { wood: 55, ice: 55, stone: 75, pig: 90, launch: 100, explosion: 160, tnt: 120, ui: 40 };
        if (lastSoundAt[name] && now - lastSoundAt[name] < (gaps[name] || 50)) return;
        lastSoundAt[name] = now;

        if (name === "launch") {
          noiseBurst(0.22, 0.075, 1400, "bandpass");
          tone(180, 0.2, "triangle", 0.035, 220);
        } else if (name === "wood") {
          tone(150, 0.09, "square", 0.035, -55);
          noiseBurst(0.08, 0.035, 650);
        } else if (name === "ice") {
          tone(1450, 0.07, "triangle", 0.025, 500);
          noiseBurst(0.1, 0.04, 3200, "highpass");
        } else if (name === "stone") {
          tone(90, 0.12, "sine", 0.055, -30);
          noiseBurst(0.1, 0.04, 380);
        } else if (name === "pig") {
          tone(620, 0.12, "square", 0.04, 360);
          tone(880, 0.1, "sine", 0.025, 220);
        } else if (name === "explosion") {
          noiseBurst(0.55, 0.16, 520);
          tone(72, 0.5, "sine", 0.11, -42);
        } else if (name === "tnt") {
          noiseBurst(0.3, 0.08, 900);
          tone(420, 0.12, "square", 0.03, 180);
        } else if (name === "ui") {
          tone(520, 0.06, "sine", 0.025, 130);
        } else if (name === "win") {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, index) => {
            setTimeout(() => tone(freq, 0.3, "triangle", 0.05, 0), index * 110);
          });
        } else if (name === "fail") {
          tone(320, 0.35, "sine", 0.045, -150);
          setTimeout(() => tone(190, 0.55, "sine", 0.04, -45), 180);
        } else if (name === "skill") {
          tone(660, 0.18, "triangle", 0.05, 520);
        }
      }

      // ---------------- World ----------------
      function rebuildEngine() {
        if (engine) {
          Events.off(engine);
          Composite.clear(engine.world, false, true);
          Engine.clear(engine);
        }
        engine = Engine.create({ enableSleeping: true });
        engine.gravity.y = 1.05;
        engine.positionIterations = 14;
        engine.velocityIterations = 10;
        engine.constraintIterations = 3;
        world = engine.world;
        Events.on(engine, "collisionStart", onCollisionStart);
        Composite.add(world, Bodies.rectangle(800, 900, 1800, 260, {
          isStatic: true, friction: 0.95, frictionStatic: 1, restitution: 0.02, label: "ground"
        }));
      }

      function addBlock(x, y, w, h, material, angle = 0) {
        const materialDef = MATERIALS[material];
        const body = Bodies.rectangle(x, y, w, h, {
          density: materialDef.density,
          friction: materialDef.friction,
          frictionStatic: materialDef.frictionStatic,
          frictionAir: 0.002,
          restitution: materialDef.restitution,
          angle,
          slop: 0.02,
          label: `block-${material}`
        });
        body.plugin = {
          kind: "block",
          material,
          w,
          h,
          health: materialDef.health,
          maxHealth: materialDef.health,

          seed: Math.random() * 1000,
          dead: false
        };
        Composite.add(world, body);
        blocks.push(body);
        return body;
      }

      function addTNT(x, y) {

      function spawnEgg(x, y, inheritedVelocity) {
        const body = Bodies.circle(x, y, 12, {
          density: 0.0045,
          friction: 0.3,
          frictionAir: 0.001,
          restitution: 0.05,

        });

      // ---------------- Damage ----------------
      function onCollisionStart(event) {
        for (const pair of event.pairs) {
          const a = pair.bodyA;
          const b = pair.bodyB;
          const impact = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
          resolveCollision(a, b, impact);
          resolveCollision(b, a, impact);
        }
      }

      function resolveCollision(body, other, impact) {
        const plugin = body.plugin;
        if (!plugin || plugin.dead) return;

        if (plugin.kind === "egg") {
          detonateEgg(body);
          return;
        }

        if (plugin.kind === "tnt") {
          if (impact > 2.2) igniteTNT(body);
          return;
        }

        if (plugin.kind === "bird") {
          handleBirdImpact(body, other, impact);
          return;
        }

        if (plugin.kind === "block") {
          if (impact > 3) {
            const attackerMass = other.isStatic ? body.mass : Math.min(24, other.mass || 3);
            const damage = (impact - 2.5) * attackerMass * 1.18 * plugin.vulnerability;
            damageBlock(body, damage, other);
          }
          return;
        }

        if (plugin.kind === "pig") {
          if (impact > 3.4) {
            const attackerMass = other.isStatic ? body.mass : Math.min(24, other.mass || 3);
            const damage = (impact - 2.8) * attackerMass * 1.02;
            if (damage > 3) damagePig(body, damage, other);
          }
        }
      }

      function handleBirdImpact(bird, other, impact) {
        if (bird.plugin.hitAt >= 0 && simTime - bird.plugin.hitAt < 0.08) return;
        bird.plugin.hitAt = simTime;
        const x = bird.position.x;
        const y = bird.position.y;

        if (impact > 4) {
          shake = Math.max(shake, Math.min(9, impact * 0.34));
          spawnImpact(x, y, other.plugin ? other.plugin.material : "wood", Math.min(10, Math.round(impact * 0.4)));

          if (other.plugin && other.plugin.kind === "block") {
            playSound(other.plugin.material === "ice" ? "ice" : other.plugin.material === "stone" ? "stone" : "wood");
          } else if (other.plugin && other.plugin.kind === "pig") {
            playSound("pig");
          } else {
            playSound("stone");
          }
        }

        if (bird.plugin.type === "black" && !skillUsed && impact > 8.2) {
          skillUsed = true;
          explodeAt(x, y, 224, 1.02, "black");
          despawnBird(bird);
          updateSkillButton();
          updateHUD();
          return;
        }

        if (bird.plugin.type === "silver" && bird.plugin.diving && impact > 6) {
          bird.plugin.diving = false;
          shockwaveAt(x, y);
        }
      }

      function damageBlock(block, damage, source) {
        const plugin = block.plugin;
        if (!plugin || plugin.dead || damage <= 0) return;
        plugin.health -= damage;

        if (plugin.health <= 0) {
          destroyBlock(block, source);
        } else if (damage > 10) {
          spawnImpact(
            block.position.x,
            block.position.y,
            plugin.material,
            Math.min(5, Math.round(damage / 18))
          );
        }
      }

      function wakeNearby(x, y, radius = 240) {
        for (const body of [...blocks, ...pigs, ...tnts, ...shotBirds, ...eggs]) {
          if (!body.plugin || body.plugin.dead || body.isStatic) continue;
          if (dist(x, y, body.position.x, body.position.y) <= radius) {
            Sleeping.set(body, false);
          }
        }
      }

      function destroyBlock(block, source) {
        const plugin = block.plugin;
        if (!plugin || plugin.dead) return;
        plugin.dead = true;
        wakeNearby(block.position.x, block.position.y);
        Composite.remove(world, block);
        destroyedCount += 1;
        score += 500;
        shake = Math.max(shake, 3.2);
        spawnDebris(block.position.x, block.position.y, plugin.material, plugin.w, plugin.h, 14);
        addFloat(block.position.x, block.position.y - 12, "+500", "#fff0b0", 16);
        playSound(plugin.material === "ice" ? "ice" : plugin.material === "stone" ? "stone" : "wood");
        updateHUD();
      }

      function damagePig(pig, damage, source) {
        const plugin = pig.plugin;
        if (!plugin || plugin.dead) return;
        plugin.health -= damage;
        if (plugin.health <= 0) {
          killPig(pig);
        } else {
          spawnParticles(pig.position.x, pig.position.y, 5, ["#6fbf43", "#4e9a2c", "#c9ef9d"], 30, 2.5);
          playSound("pig");
        }
      }

      function killPig(pig) {
        const plugin = pig.plugin;
        if (!plugin || plugin.dead) return;
        plugin.dead = true;
        wakeNearby(pig.position.x, pig.position.y);
        Composite.remove(world, pig);
        pigsLeft = Math.max(0, pigsLeft - 1);
        score += 5000;
        shake = Math.max(shake, 5.5);
        spawnPigBurst(pig.position.x, pig.position.y);
        addFloat(pig.position.x, pig.position.y - 18, "+5000", "#d9ff92", 24);
        playSound("pig");
        updateHUD();
        if (pigsLeft === 0 && !winAt) winAt = simTime + 1.15;
      }

      function igniteTNT(body, delay = 0.62) {
        const plugin = body.plugin;
        if (!plugin || plugin.dead || plugin.ignited) return;
        plugin.ignited = true;
        plugin.fuse = delay + Math.random() * 0.16;
        spawnParticles(body.position.x, body.position.y - 30, 10, ["#ffe28a", "#ff914d", "#ff5b39"], 90, 3);
        playSound("tnt");
      }

      function explodeTNT(body) {
        const plugin = body.plugin;
        if (!plugin || plugin.dead) return;
        plugin.dead = true;
        plugin.ignited = false;
        const x = body.position.x;
        const y = body.position.y;
        Composite.remove(world, body);
        destroyedCount += 1;
        score += 800;
        spawnDebris(x, y, "tnt", 54, 64, 18);
        addFloat(x, y - 20, "TNT +800", "#ffd369", 20);
        explodeAt(x, y, 242, 1.38, "tnt");
        updateHUD();
      }

      function shockwaveAt(x, y) {
        shockwaves.push({ x, y, r: 20, max: 150, life: 0.45, maxLife: 0.45, color: "rgba(225,250,255," });
        shake = Math.max(shake, 8);
        flash = Math.max(flash, 0.1);
        spawnParticles(x, y, 18, ["#e8faff", "#a9dcf5", "#7fbfe8"], 160, 4);
        playSound("explosion");
        for (const body of [...blocks, ...pigs, ...tnts, ...shotBirds]) {
          if (!body.plugin || body.plugin.dead || body.isStatic) continue;
          const d = dist(x, y, body.position.x, body.position.y);
          if (d < 155) {
            const force = (1 - d / 155) * 0.04 * body.mass;
            Sleeping.set(body, false);
            Body.applyForce(body, body.position, {
              x: ((body.position.x - x) / (d || 1)) * force,
              y: ((body.position.y - y) / (d || 1)) * force - force * 0.16
            });
          }
        }
      }

      function explodeAt(x, y, radius, power, source) {
        shockwaves.push({
          x, y, r: 12, max: radius * 1.15,
          life: 0.55, maxLife: 0.55,
          color: source === "tnt" ? "rgba(255,180,79," : "rgba(255,239,184,"
        });
        shake = Math.max(shake, Math.min(24, radius / 11));
        flash = Math.max(flash, source === "egg" ? 0.14 : 0.28);
        spawnExplosion(x, y, radius, source);
        playSound("explosion");

        for (const body of [...blocks, ...pigs, ...tnts, ...shotBirds, ...eggs]) {
          if (!body.plugin || body.plugin.dead || body.isStatic) continue;
          const d = dist(x, y, body.position.x, body.position.y);
          if (d > radius) continue;
          const falloff = 1 - d / radius;
          const force = 0.062 * power * falloff * body.mass;
          Sleeping.set(body, false);
          Body.applyForce(body, body.position, {
            x: ((body.position.x - x) / (d || 1)) * force,
            y: ((body.position.y - y) / (d || 1)) * force - force * 0.2
          });
        }

        for (const block of [...blocks]) {
          if (!block.plugin || block.plugin.dead) continue;
          const d = dist(x, y, block.position.x, block.position.y);
          if (d < radius) {
            damageBlock(block, (1 - d / radius) * 250 * power, null);
          }
        }

        for (const tnt of [...tnts]) {
          if (!tnt.plugin || tnt.plugin.dead) continue;
          const d = dist(x, y, tnt.position.x, tnt.position.y);
          if (d < radius * 1.14) igniteTNT(tnt, 0.16 + d / radius * 0.22);
        }

        for (const pig of [...pigs]) {
          if (!pig.plugin || pig.plugin.dead) continue;
          const d = dist(x, y, pig.position.x, pig.position.y);
          if (d < radius * 0.98) {
            killPig(pig);
          } else if (d < radius * 1.18) {
            damagePig(pig, 30 * power, null);
          }
        }

        for (const egg of [...eggs]) {
          if (egg.plugin.dead) continue;
          const d = dist(x, y, egg.position.x, egg.position.y);
          if (d < radius) detonateEgg(egg, true);
        }
      }

      function detonateEgg(egg, chained = false) {
        const plugin = egg.plugin;
        if (!plugin || plugin.dead) return;
        plugin.dead = true;
        const x = egg.position.x;
        const y = egg.position.y;
        Composite.remove(world, egg);
        explodeAt(x, y, 158, 0.72, "egg");
        if (!chained) playSound("explosion");
      }

      function despawnBird(bird) {
        if (!bird || bird.plugin.dead) return;
        bird.plugin.dead = true;
        Composite.remove(world, bird);
        shotBirds = shotBirds.filter((item) => item !== bird);
        if (currentActiveBird === bird) currentActiveBird = shotBirds[0] || null;
      }

      // ---------------- Level flow ----------------
      function loadLevel(index) {
        levelIndex = index;
        level = LEVELS[index];
        theme = THEMES[level.theme] || THEMES.meadow;
        blocks = [];
        pigs = [];
        tnts = [];
        eggs = [];
        shotBirds = [];
        birdQueue = level.birds.slice();
        currentBirdType = null;
        currentActiveBird = null;
        score = 0;
        pigsLeft = 0;
        pigsTotal = 0;
        blocksTotal = 0;
        destroyedCount = 0;
        leftoverBonus = 0;
        simTime = 0;
        shotActive = false;
        shotAge = 0;
        shotCalm = 0;
        skillUsed = false;
        betweenTurnsAt = 0;
        defeatAt = 0;
        winAt = 0;
        drag = null;
        aimPower = 0;
        particles = [];
        floatTexts = [];
        shockwaves = [];
        shake = 0;
        flash = 0;
        lastSoundAt = {};

        rebuildEngine();
        level.build();
        pigsTotal = pigs.length;
        pigsLeft = pigs.length;
        blocksTotal = blocks.length + tnts.length;
        hudLevel.textContent = `第 ${index + 1} 关`;
        updateHUD();
        beginTurn();
      }

      function startLevel(index) {
        hideAllScreens();
        state = "playing";
        hud.classList.remove("is-hidden");
        localStorage.setItem(SCHEDULE_KEY, String(index));
        loadLevel(index);
        showLevelToast();
        playSound("ui");
      }

      function beginTurn() {
        if (pigsLeft <= 0 || birdQueue.length === 0) return;
        currentBirdType = birdQueue.shift();
        currentActiveBird = null;
        shotBirds = [];
        eggs = [];
        drag = null;
        aimPower = 0;
        shotActive = false;
        shotAge = 0;
        shotCalm = 0;
        skillUsed = false;
        betweenTurnsAt = 0;
        defeatAt = 0;
        updateSkillButton();
        updateHUD();
        showTip("按住小鸟向后拖拽 · 松手发射", 3200);
      }

      function launchBird() {
        if (!drag || !currentBirdType || state !== "playing") return;
        const dx = ANCHOR.x - drag.x;
        const dy = ANCHOR.y - drag.y;
        const pull = Math.hypot(dx, dy);
        if (pull < 16) {
          drag = null;
          aimPower = 0;
          showTip("再拉远一点，弹弓才有力量", 1600);
          return;
        }

        const bird = createBirdBody(currentBirdType, drag.x, drag.y);
        Composite.add(world, bird);
        Body.setVelocity(bird, { x: dx * PULL_SPEED, y: dy * PULL_SPEED });
        Body.setAngularVelocity(bird, 0.025);
        Sleeping.set(bird, false);

        shotBirds = [bird];
        currentActiveBird = bird;
        shotActive = true;
        shotAge = 0;
        shotCalm = 0;
        skillUsed = false;
        drag = null;
        aimPower = 0;
        playSound("launch");
        updateSkillButton();
        updateHUD();

        const def = BIRDS[currentBirdType];
        if (def.skill) {
          showTip("飞行中点击画面 · 释放「" + def.skillName + "」", 2400);
        } else {
          showTip("观察结构坍塌 · 命中承重柱效果更好", 2300);
        }
      }

      function finishShot() {
        if (!shotActive) return;
        for (const bird of [...shotBirds]) despawnBird(bird);
        for (const egg of [...eggs]) {
          if (!egg.plugin.dead) {
            egg.plugin.dead = true;
            Composite.remove(world, egg);
          }
        }
        shotBirds = [];
        eggs = [];
        currentActiveBird = null;
        currentBirdType = null;
        shotActive = false;
        shotAge = 0;
        shotCalm = 0;
        skillUsed = false;
        updateSkillButton();
        updateHUD();

        if (pigsLeft <= 0) {
          if (!winAt) winAt = simTime + 0.45;
          return;
        }

        if (birdQueue.length > 0) {
          betweenTurnsAt = simTime + 0.72;
          showTip("下一只小鸟准备中…", 1100);
        } else {
          defeatAt = simTime + 1.15;
          showTip("最后一只小鸟也用完了…", 1600);
        }
      }

      function activateSkill() {
        if (state !== "playing" || !shotActive || skillUsed || !currentBirdType) return;
        const def = BIRDS[currentBirdType];
        if (!def.skill) return;
        const main = shotBirds.find((bird) => !bird.plugin.dead && bird.plugin.isMain) || shotBirds.find((bird) => !bird.plugin.dead);
        if (!main) return;

        skillUsed = true;
        playSound("skill");
        const vx = main.velocity.x;
        const vy = main.velocity.y;
        const speed = Math.hypot(vx, vy);
        const angle = Math.atan2(vy, vx);

        if (def.skill === "split") {
          const originX = main.position.x;
          const originY = main.position.y;
          despawnBird(main);
          [-0.16, 0, 0.16].forEach((offset, index) => {
            const mini = Bodies.circle(originX, originY + (index - 1) * 6, 14, {
              density: 0.0062,
              friction: 0.4,
              frictionAir: 0.0016,
              restitution: 0.3,
              slop: 0.02,
              label: "bird-blue-mini"
            });
            mini.plugin = {
              kind: "bird", type: "blue", radius: 14, dead: false, isMain: false,
              trail: [], faceAngle: angle, hitAt: -1, diving: false, boomerang: false
            };
            Composite.add(world, mini);
            Body.setVelocity(mini, {
              x: Math.cos(angle + offset) * Math.max(8, speed * 1.06),
              y: Math.sin(angle + offset) * Math.max(8, speed * 1.06)
            });
            shotBirds.push(mini);
            spawnParticles(originX, originY, 5, ["#bdefff", "#5cc2ef", "#2d8fc3"], 45, 2);
          });
          currentActiveBird = shotBirds[0] || null;
          flash = Math.max(flash, 0.1);
        } else if (def.skill === "dash") {
          if (speed < 2) {
            Body.setVelocity(main, { x: 16, y: 0 });
          } else {
            const boost = 15;
            const nx = vx / speed;
            const ny = vy / speed;
            Body.setVelocity(main, { x: nx * Math.min(38, speed + boost), y: ny * Math.min(38, speed + boost) });
          }
          main.plugin.hitAt = -1;
          spawnParticles(main.position.x, main.position.y, 16, ["#fff2a0", "#f7c532", "#e89a16"], 120, 3);
          shake = Math.max(shake, 2.5);
        } else if (def.skill === "bomb") {
          explodeAt(main.position.x, main.position.y, 224, 1.02, "black");
          despawnBird(main);
        } else if (def.skill === "egg") {
          const egg = spawnEgg(main.position.x, main.position.y + main.plugin.radius + 20, {
            x: vx * 0.82,
            y: Math.max(vy, 0) + 3.2
          });
          egg.plugin.trail.push({ x: main.position.x, y: main.position.y });
          Body.setVelocity(main, { x: vx * 0.68, y: Math.min(vy, 0) - 4.2 });
          spawnParticles(main.position.x, main.position.y, 10, ["#ffffff", "#fff4c4", "#ffd76e"], 80, 2.5);
        } else if (def.skill === "dive") {
          Body.setVelocity(main, {
            x: vx * 1.04 + 2.2,
            y: Math.max(vy, 2) + 10.5
          });
          main.plugin.diving = true;
          spawnParticles(main.position.x, main.position.y, 12, ["#f4f7ff", "#b9c0cf", "#8b93a3"], 100, 3);
        } else if (def.skill === "boomerang") {
          Body.setVelocity(main, {
            x: -vx * 0.92 - 2,
            y: -Math.abs(vy) * 0.35 - 5
          });
          main.plugin.boomerang = true;
          spawnParticles(main.position.x, main.position.y, 14, ["#c8f28e", "#74c94e", "#3c9130"], 100, 3);
          flash = Math.max(flash, 0.06);
        }

        updateSkillButton();
        updateHUD();
      }

      function updateGame(dt) {
        if (state !== "playing") return;
        simTime += dt;
        gameFrame += 1;

        if (shotActive) {
          shotAge += dt;
          for (const bird of shotBirds) {
            if (bird.plugin.dead) continue;
            bird.plugin.trail.push({ x: bird.position.x, y: bird.position.y });
            if (bird.plugin.trail.length > 24) bird.plugin.trail.shift();
            const sp = speedOf(bird);
            if (sp > 1.1) {
              const target = Math.atan2(bird.velocity.y, bird.velocity.x);
              let delta = target - bird.plugin.faceAngle;
              while (delta > Math.PI) delta -= Math.PI * 2;
              while (delta < -Math.PI) delta += Math.PI * 2;
              bird.plugin.faceAngle += delta * 0.18;
            }
          }

          for (const egg of eggs) {
            if (egg.plugin.dead) continue;
            egg.plugin.trail.push({ x: egg.position.x, y: egg.position.y });
            if (egg.plugin.trail.length > 12) egg.plugin.trail.shift();
            egg.plugin.fuse -= dt;
            if (egg.plugin.fuse <= 0) detonateEgg(egg);
          }

          for (const bird of [...shotBirds]) {
            if (!bird.plugin.dead && (bird.position.y > 1010 || bird.position.x > 1770 || bird.position.x < -140)) {
              despawnBird(bird);
            }
          }
          for (const egg of [...eggs]) {
            if (!egg.plugin.dead && (egg.position.y > 1000 || egg.position.x > 1760 || egg.position.x < -80)) {
              egg.plugin.dead = true;
              Composite.remove(world, egg);
            }
          }
          eggs = eggs.filter((egg) => !egg.plugin.dead);

          const activeEntities = [...shotBirds, ...eggs].filter((body) => !body.plugin.dead);
          let calm = true;
          for (const entity of activeEntities) {
            if (speedOf(entity) > 1.6) {
              calm = false;
              break;
            }
          }
          if (shotAge > 0.9 && calm) {
            shotCalm += dt;
          } else if (!calm) {
            shotCalm = 0;
          }
          if (shotCalm > 0.65 || shotAge > 8.8) finishShot();
        }

        for (const tnt of tnts) {
          if (!tnt.plugin.dead && tnt.plugin.ignited) {
            tnt.plugin.fuse -= dt;
            if (tnt.plugin.fuse <= 0) explodeTNT(tnt);
          }
        }

        for (const pig of pigs) {
          if (pig.plugin.dead) continue;
          if (pig.position.y > 960 || pig.position.x > 1780 || pig.position.x < -120) {
            killPig(pig);
          }
        }

        for (const block of blocks) {
          if (!block.plugin.dead && (block.position.y > 980 || block.position.x > 1810 || block.position.x < -160)) {
            block.plugin.dead = true;
            Composite.remove(world, block);
            destroyedCount += 1;
            updateHUD();
          }
        }

        if (pigsLeft === 0 && !winAt) winAt = simTime + 1.1;
        if (winAt && simTime >= winAt) {
          finishLevel(true);
          return;
        }
        if (defeatAt && simTime >= defeatAt && pigsLeft > 0) {
          finishLevel(false);
          return;
        }
        if (betweenTurnsAt && simTime >= betweenTurnsAt && pigsLeft > 0 && !shotActive) {
          betweenTurnsAt = 0;
          beginTurn();
        }
      }

      function finishLevel(won) {
        if (state !== "playing") return;
        state = won ? "complete" : "failed";
        shotActive = false;
        skillBtn.hidden = true;
        hideTip();
        if (won) {
          leftoverBonus = birdQueue.length * 10000;
          score += leftoverBonus;
          const stars = calcStars();
          saveRecord(levelIndex, score, stars);
          playSound("win");
          showResult(true, stars);
        } else {
          playSound("fail");
          showResult(false, 0);
        }
        updateHUD();
      }

      function calcStars() {
        if (score >= level.star3) return 3;
        if (score >= level.star2) return 2;
        return 1;
      }

      function showResult(won, stars) {
        const ratio = blocksTotal > 0 ? Math.round((destroyedCount / blocksTotal) * 100) : 0;
        const nextIndex = levelIndex + 1;
        const isLast = nextIndex >= LEVELS.length;
        const title = won ? (stars === 3 ? "完美三星！" : "堡垒攻破！") : "小鸟用完了…";
        const subtitle = won
          ? (isLast ? "全部关卡通关，猪猪堡垒彻底沦陷。" : "干净利落的一击。试试用更少的鸟刷新纪录。")
          : "还差几只绿猪。调整角度，优先拆掉承重柱和 TNT。";

        const nextButton = won && !isLast
          ? `<button class="btn btn-primary" type="button" data-result-action="next">下一关</button>`
          : "";

        resultCard.innerHTML = `
          <section class="result-card">
            <div class="result-kicker">${won ? "LEVEL CLEAR" : "OUT OF BIRDS"}</div>
            <h2>${title}</h2>
            <div class="star-row" aria-label="${stars} 星">
              <span class="star">★</span><span class="star">★</span><span class="star">★</span>
            </div>
            <p class="result-sub">${subtitle}</p>
            <div class="result-stats">
              <div class="result-stat"><small>得分</small><strong>${score.toLocaleString("en-US")}</strong></div>
              <div class="result-stat"><small>剩余小鸟</small><strong>${won ? birdQueue.length : 0}</strong></div>
              <div class="result-stat"><small>摧毁建筑</small><strong>${ratio}%</strong></div>
            </div>
            <div class="result-actions">
              ${nextButton}
              <button class="btn ${won && !isLast ? "btn-ghost" : "btn-primary"}" type="button" data-result-action="retry">${won ? "重玩本关" : "再试一次"}</button>
              <button class="btn btn-ghost" type="button" data-result-action="menu">选择关卡</button>
            </div>
          </section>
        `;
        resultScreen.classList.remove("hidden");
        requestAnimationFrame(() => {
          const starEls = resultCard.querySelectorAll(".star");
          for (let i = 0; i < stars; i += 1) {
            setTimeout(() => {
              if (starEls[i]) starEls[i].classList.add("lit");
              if (soundOn) tone(620 + i * 130, 0.16, "triangle", 0.04, 0);
            }, 180 + i * 190);
          }
        });
      }

      // ---------------- UI ----------------
      function updateHUD() {
        hudScore.textContent = toCss(score);
        hudPigs.textContent = String(pigsLeft);
        if (!level) return;
        const parts = [];
        parts.push(`<span class="bird-strip-label">${shotActive ? "飞行中" : "弹弓队列"}</span>`);
        if (currentBirdType) {
          const def = BIRDS[currentBirdType];
          parts.push(`<span class="bird-token current b-${currentBirdType}" title="${def.name}">${def.short}</span>`);
        }
        for (const type of birdQueue) {
          const def = BIRDS[type];
          parts.push(`<span class="bird-token b-${type}" title="${def.name}">${def.short}</span>`);
        }
        birdStrip.innerHTML = parts.join("");
      }

      function updateSkillButton() {
        const def = currentBirdType ? BIRDS[currentBirdType] : null;
        const show = state === "playing" && shotActive && !skillUsed && def && def.skill &&
          shotBirds.some((bird) => !bird.plugin.dead);
        skillBtn.hidden = !show;
        if (show) skillName.textContent = def.skillName;
      }

      function showTip(text, duration = 2400) {
        tip.textContent = text;
        tip.classList.add("show");
        clearTimeout(tipTimer);
        if (duration > 0) {
          tipTimer = setTimeout(() => tip.classList.remove("show"), duration);
        }
      }

      function hideTip() {
        clearTimeout(tipTimer);
        tip.classList.remove("show");
      }

      function showLevelToast() {
        toastKicker.textContent = `LEVEL ${String(levelIndex + 1).padStart(2, "0")}`;
        toastTitle.textContent = level.name;
        toastSub.textContent = `${pigsLeft} 只绿猪 · ${level.birds.length} 只小鸟`;
        levelToast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => levelToast.classList.remove("show"), 2400);
      }

      function hideAllScreens() {
        startScreen.classList.add("hidden");
        guideScreen.classList.add("hidden");
        resultScreen.classList.add("hidden");
      }

      function goMenu() {
        state = "menu";
        shotActive = false;
        drag = null;
        currentBirdType = null;
        hud.classList.add("is-hidden");
        hideTip();
        skillBtn.hidden = true;
        resultScreen.classList.add("hidden");
        guideScreen.classList.add("hidden");
        startScreen.classList.remove("hidden");
        buildMenu();
        playSound("ui");
      }

      function openGuide() {
        guideScreen.classList.remove("hidden");
        playSound("ui");
      }

      function closeGuide() {
        guideScreen.classList.add("hidden");
        playSound("ui");
      }

      function firstUnfinishedLevel() {
        const records = getRecords();
        for (let i = 0; i < LEVELS.length; i += 1) {
          if (!records[i] || records[i].stars < 3) return i;
        }
        return 0;
      }

      function quickStartLevel() {
        const stored = Number(localStorage.getItem(SCHEDULE_KEY));
        if (Number.isInteger(stored) && stored >= 0 && stored < LEVELS.length) {
          startLevel(stored);
        } else {
          startLevel(firstUnfinishedLevel());
        }
      }

      // ---------------- Input ----------------
      function pointerToWorld(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left - view.ox) / view.scale,
          y: (event.clientY - rect.top - view.oy) / view.scale
        };
      }

      function onPointerDown(event) {
        if (state !== "playing") return;
        event.preventDefault();
        ensureAudio();
        if (event.target !== canvas) return;

        if (shotActive) {
          activateSkill();
          return;
        }
        if (!currentBirdType || betweenTurnsAt) return;
        const point = pointerToWorld(event);
        if (dist(point.x, point.y, ANCHOR.x, ANCHOR.y) > 250) {
          showTip("按住弹弓上的小鸟再拖拽", 1400);
          return;
        }
        drag = { x: ANCHOR.x, y: ANCHOR.y, pointerId: event.pointerId };
        canvas.setPointerCapture?.(event.pointerId);
        updateDrag(point);
      }

      function updateDrag(point) {
        let dx = point.x - ANCHOR.x;
        let dy = point.y - ANCHOR.y;
        const len = Math.hypot(dx, dy);
        if (len > MAX_PULL) {
          dx = (dx / len) * MAX_PULL;
          dy = (dy / len) * MAX_PULL;
        }
        drag.x = ANCHOR.x + dx;
        drag.y = ANCHOR.y + dy;
        aimPower = Math.min(1, Math.hypot(dx, dy) / MAX_PULL);
        showTip(`力度 ${Math.round(aimPower * 100)}% · 松手发射`, 0);
      }

      function onPointerMove(event) {
        if (!drag || state !== "playing") return;
        event.preventDefault();
        updateDrag(pointerToWorld(event));
      }

      function onPointerUp(event) {
        if (!drag || state !== "playing") return;
        event.preventDefault();
        launchBird();
        canvas.releasePointerCapture?.(event.pointerId);
      }

      function onPointerCancel() {
        if (!drag) return;
        drag = null;
        aimPower = 0;
        hideTip();
      }

      function updateSoundButton() {
        soundBtn.classList.toggle("muted", !soundOn);
        soundBtn.setAttribute("aria-label", soundOn ? "关闭音效" : "开启音效");
        soundBtn.title = soundOn ? "关闭音效" : "开启音效";
      }

      // ---------------- Result actions ----------------
      resultCard.addEventListener("click", (event) => {
        const button = event.target.closest("[data-result-action]");
        if (!button) return;
        const action = button.dataset.resultAction;
        ensureAudio();
        if (action === "next") {
          startLevel(levelIndex + 1);
        } else if (action === "retry") {
          startLevel(levelIndex);
        } else if (action === "menu") {
          goMenu();
        }
      });

      levelGrid.addEventListener("click", (event) => {
        const card = event.target.closest("[data-level]");
        if (!card) return;
        ensureAudio();
        startLevel(Number(card.dataset.level));
      });

      quickPlay.addEventListener("click", () => {
        ensureAudio();
        quickStartLevel();
      });
      guideBtn.addEventListener("click", openGuide);
      guideClose.addEventListener("click", closeGuide);
      soundBtn.addEventListener("click", () => {
        ensureAudio();
        soundOn = !soundOn;
        localStorage.setItem("ab_sound", soundOn ? "on" : "off");
        updateSoundButton();
        if (soundOn) playSound("ui");
      });
      restartBtn.addEventListener("click", () => {
        if (state === "playing") {
          ensureAudio();
          startLevel(levelIndex);
        }
      });
      homeBtn.addEventListener("click", () => {
        if (state === "playing" || state === "complete" || state === "failed") goMenu();
      });
      skillBtn.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        event.stopPropagation();
        activateSkill();
      });
      rotateContinue.addEventListener("click", () => {
        localStorage.setItem("ab_rotate_skip", "1");
        rotateOverlay.classList.remove("show");
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "r" || event.key === "R") {
          if (state === "playing" || state === "complete" || state === "failed") {
            ensureAudio();
            startLevel(levelIndex);
          }
        } else if (event.key === "m" || event.key === "M") {
          soundBtn.click();
        } else if (event.key === " " || event.key === "Enter") {
          if (state === "playing" && shotActive) {
            event.preventDefault();
            activateSkill();
          }
        } else if (event.key === "Escape") {
          if (state === "playing" || state === "complete" || state === "failed") goMenu();
        }
      });

      // ---------------- Particles ----------------
      function spawnParticles(x, y, count, colors, speed, size) {
        for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const velocity = rand(speed * 0.35, speed);
          const life = rand(0.35, 0.85);
          particles.push({
            x, y,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity - speed * 0.16,
            gravity: 480,
            drag: 0.965,
            size: rand(size * 0.5, size),
            color: colors[Math.floor(Math.random() * colors.length)],
            shape: "circle",
            life, maxLife: life,
            rot: 0, vr: rand(-8, 8),
            glow: false
          });
        }
        if (particles.length > 520) particles.splice(0, particles.length - 520);
      }

      function spawnImpact(x, y, material, count) {
        const palette = material === "ice"
          ? ["#d9f8ff", "#8bdcf5", "#57b8df", "#ffffff"]
          : material === "stone"
            ? ["#d7d9d5", "#9ba3a4", "#727b7e", "#fff3d1"]
            : ["#ffe7a5", "#dfa35c", "#a8662e", "#6f3e16"];
        for (let i = 0; i < count; i += 1) {
          const angle = rand(-Math.PI, 0);
          const life = rand(0.3, 0.65);
          particles.push({
            x, y,
            vx: Math.cos(angle) * rand(40, 150),
            vy: Math.sin(angle) * rand(30, 140),
            gravity: 520,
            drag: 0.97,
            size: rand(2, 5),
            color: palette[Math.floor(Math.random() * palette.length)],
            shape: material === "ice" ? "triangle" : "rect",
            life, maxLife: life,
            rot: rand(0, 6), vr: rand(-12, 12),
            glow: false
          });
        }
      }

      function spawnDebris(x, y, material, w, h, count) {
        const palette = material === "ice"
          ? ["#e7fbff", "#a9e9fa", "#69c4e2", "#ffffff"]
          : material === "stone"
            ? ["#c7cbc8", "#9aa1a2", "#737b7d", "#e8e6dc"]
            : material === "tnt"
              ? ["#e44635", "#a9231b", "#ffc64c", "#4b2c20"]
              : ["#db9a4c", "#b26c2c", "#8d4d1d", "#f0c47e"];
        const maxDimension = Math.max(w, h);
        for (let i = 0; i < count; i += 1) {
          const angle = rand(-Math.PI, 0);
          const life = rand(0.55, 1.25);
          particles.push({
            x: x + rand(-w * 0.35, w * 0.35),
            y: y + rand(-h * 0.35, h * 0.35),
            vx: Math.cos(angle) * rand(40, 200) + (x - 800) * 0.02,
            vy: Math.sin(angle) * rand(60, 190),
            gravity: 600,
            drag: 0.975,
            size: rand(maxDimension * 0.08, maxDimension * 0.22),
            color: palette[Math.floor(Math.random() * palette.length)],
            shape: material === "ice" ? "triangle" : material === "wood" ? "rect" : "square",
            life, maxLife: life,
            rot: rand(0, 6.28), vr: rand(-11, 11),
            glow: false
          });
        }
        if (particles.length > 520) particles.splice(0, particles.length - 520);
      }

      function spawnPigBurst(x, y) {
        for (let i = 0; i < 22; i += 1) {
          const angle = rand(-Math.PI, 0);
          const life = rand(0.5, 1.1);
          particles.push({
            x: x + rand(-15, 15),
            y: y + rand(-15, 15),
            vx: Math.cos(angle) * rand(45, 180),
            vy: Math.sin(angle) * rand(50, 170),
            gravity: 460,
            drag: 0.975,
            size: rand(5, 15),
            color: ["#76c64c", "#4f9f2d", "#b9e780", "#dcf7b0"][Math.floor(Math.random() * 4)],
            shape: "circle",
            life, maxLife: life,
            rot: 0, vr: rand(-5, 5),
            glow: false
          });
        }
        for (let i = 0; i < 10; i += 1) {
          const life = rand(0.35, 0.8);
          particles.push({
            x, y: y - 5, vx: rand(-100, 100), vy: rand(-160, -40),
            gravity: 240, drag: 0.98, size: rand(7, 16),
            color: "#fff1cb", shape: "star", life, maxLife: life,
            rot: rand(0, 6.28), vr: rand(-8, 8), glow: true
          });
        }
      }

      function spawnExplosion(x, y, radius, source) {
        const tnt = source === "tnt";
        for (let i = 0; i < 28; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const velocity = rand(60, radius * 1.5);
          const life = rand(0.35, 0.95);
          particles.push({
            x, y,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity - rand(10, 100),
            gravity: 280,
            drag: 0.955,
            size: rand(10, 34),
            color: tnt ? ["#ffcf65", "#ff7a3c", "#e83c27", "#ffeaa0"][Math.floor(Math.random() * 4)]
              : ["#ffe28e", "#fff2c2", "#ff9847", "#ffffff"][Math.floor(Math.random() * 4)],
            shape: "circle",
            life, maxLife: life,
            rot: 0, vr: 0,
            glow: true
          });
        }
        for (let i = 0; i < 18; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const life = rand(0.65, 1.35);
          particles.push({
            x: x + rand(-20, 20),
            y: y + rand(-20, 20),
            vx: Math.cos(angle) * rand(20, 90),
            vy: Math.sin(angle) * rand(20, 80) - 30,
            gravity: -30,
            drag: 0.98,
            size: rand(12, 38),
            color: "rgba(75, 70, 62, 0.28)",
            shape: "circle",
            life, maxLife: life,
            rot: 0, vr: 0,
            glow: false
          });
        }
        for (let i = 0; i < 16; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const life = rand(0.3, 0.75);
          particles.push({
            x, y,
            vx: Math.cos(angle) * rand(120, 380),
            vy: Math.sin(angle) * rand(120, 380),
            gravity: 500,
            drag: 0.985,
            size: rand(2, 5),
            color: "#fff6c8",
            shape: "rect",
            life, maxLife: life,
            rot: angle, vr: rand(-20, 20),
            glow: true
          });
        }
        if (particles.length > 520) particles.splice(0, particles.length - 520);
      }

      function addFloat(x, y, text, color, size) {
        floatTexts.push({
          x, y, text, color, size,
          life: 1.15, maxLife: 1.15, vy: -48
        });
      }

      function updateParticles(dt) {
        for (const p of particles) {
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= Math.pow(p.drag, dt * 60);
          p.vy = p.vy * Math.pow(p.drag, dt * 60) + p.gravity * dt;
          p.rot += p.vr * dt;
        }
        particles = particles.filter((p) => p.life > 0);

        for (const f of floatTexts) {
          f.life -= dt;
          f.y += f.vy * dt;
          f.vy *= Math.pow(0.94, dt * 60);
        }
        floatTexts = floatTexts.filter((f) => f.life > 0);

        for (const s of shockwaves) {
          s.life -= dt;
          const progress = 1 - s.life / s.maxLife;
          s.r = 14 + (s.max - 14) * (1 - Math.pow(1 - progress, 2.2));
        }
        shockwaves = shockwaves.filter((s) => s.life > 0);
      }

      // ---------------- Drawing helpers ----------------
      function roundRectPath(x, y, w, h, r) {
        const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      function drawCracks(w, h, ratio, seed, color) {
        if (ratio > 0.72) return;
        const level = ratio < 0.32 ? 3 : ratio < 0.52 ? 2 : 1;
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(1, Math.min(w, h) * 0.035);
        ctx.lineCap = "round";
        for (let i = 0; i < level; i += 1) {
          const sx = (hash(seed + i * 7.13) - 0.5) * w * 0.65;
          const sy = (hash(seed + i * 11.7 + 2) - 0.5) * h * 0.65;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          let px = sx;
          let py = sy;
          for (let j = 1; j <= 4; j += 1) {
            px += (hash(seed + i * 9 + j * 3.2) - 0.5) * w * 0.28;
            py += (hash(seed + i * 5 + j * 7.4) - 0.5) * h * 0.28;
            ctx.lineTo(clamp(px, -w * 0.48, w * 0.48), clamp(py, -h * 0.48, h * 0.48));
          }
          ctx.stroke();
        }
        if (level >= 2) {
          ctx.globalAlpha = 0.6;
          for (let i = 0; i < 4; i += 1) {
            const x = (hash(seed + i * 4.1) - 0.5) * w * 0.8;
            const y = (hash(seed + i * 6.7 + 9) - 0.5) * h * 0.8;
            ctx.beginPath();
            ctx.arc(x, y, Math.max(1.5, Math.min(w, h) * 0.035), 0, Math.PI * 2);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function drawBlock(block) {
        const p = block.plugin;
        if (!p || p.dead) return;
        ctx.save();
        ctx.translate(block.position.x, block.position.y);
        ctx.rotate(block.angle);
        const w = p.w;
        const h = p.h;
        const x = -w / 2;
        const y = -h / 2;

        if (p.material === "wood") {
          const gradient = ctx.createLinearGradient(x, y, x + w, y + h);
          gradient.addColorStop(0, "#e0a556");
          gradient.addColorStop(0.42, "#c9843a");
          gradient.addColorStop(1, "#9a5725");
          roundRectPath(x, y, w, h, Math.min(6, h * 0.22));
          ctx.fillStyle = gradient;
          ctx.fill();
          ctx.save();
          roundRectPath(x, y, w, h, Math.min(6, h * 0.22));
          ctx.clip();
          ctx.strokeStyle = "rgba(92, 48, 17, 0.34)";
          ctx.lineWidth = 1;
          const long = h > w;
          const count = Math.max(2, Math.floor((long ? w : h) / 9));
          for (let i = 1; i < count; i += 1) {
            const offset = (i / count - 0.5) * (long ? w : h);
            ctx.beginPath();
            if (long) {
              ctx.moveTo(offset, y);
              ctx.bezierCurveTo(offset + 4, y + h * 0.33, offset - 3, y + h * 0.66, offset + 1, y + h);
            } else {
              ctx.moveTo(x, offset);
              ctx.bezierCurveTo(x + w * 0.33, offset + 3, x + w * 0.66, offset - 3, x + w, offset + 1);
            }
            ctx.stroke();
          }
          if (Math.min(w, h) > 20) {
            const knotX = (hash(p.seed) - 0.5) * w * 0.6;
            const knotY = (hash(p.seed + 3) - 0.5) * h * 0.6;
            ctx.strokeStyle = "rgba(83, 43, 16, 0.45)";
            ctx.beginPath();
            ctx.ellipse(knotX, knotY, Math.min(w, h) * 0.1, Math.min(w, h) * 0.055, 0.4, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
          ctx.strokeStyle = "rgba(100, 54, 18, 0.78)";
          ctx.lineWidth = 2.4;
          roundRectPath(x, y, w, h, Math.min(6, h * 0.22));
          ctx.stroke();
          if (Math.min(w, h) > 22) {
            ctx.fillStyle = "rgba(255, 226, 166, 0.45)";
            ctx.fillRect(x + 4, y + 4, w - 8, Math.min(3, h * 0.08));
          }
        } else if (p.material === "ice") {
          const gradient = ctx.createLinearGradient(x, y, x + w, y + h);
          gradient.addColorStop(0, "rgba(235, 253, 255, 0.92)");
          gradient.addColorStop(0.45, "rgba(150, 222, 241, 0.82)");
          gradient.addColorStop(1, "rgba(82, 174, 211, 0.82)");
          roundRectPath(x, y, w, h, Math.min(5, h * 0.18));
          ctx.fillStyle = gradient;
          ctx.fill();
          ctx.save();
          roundRectPath(x, y, w, h, Math.min(5, h * 0.18));
          ctx.clip();
          ctx.fillStyle = "rgba(255,255,255,0.38)";
          ctx.beginPath();
          ctx.moveTo(x + w * 0.12, y);
          ctx.lineTo(x + w * 0.42, y);
          ctx.lineTo(x + w * 0.78, y + h);
          ctx.lineTo(x + w * 0.48, y + h);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.45)";
          ctx.lineWidth = 1;
          for (let i = 0; i < 3; i += 1) {
            const bx = x + hash(p.seed + i * 4) * w;
            const by = y + hash(p.seed + i * 8 + 2) * h;
            ctx.beginPath();
            ctx.arc(bx, by, rand(1.2, 3.2), 0, Math.PI * 2);
            ctx.stroke();
          }
          drawCracks(w, h, p.health / p.maxHealth, p.seed, "rgba(255,255,255,0.72)");
          ctx.restore();
          ctx.strokeStyle = "rgba(92, 185, 219, 0.72)";
          ctx.lineWidth = 2;
          roundRectPath(x, y, w, h, Math.min(5, h * 0.18));
          ctx.stroke();
        } else if (p.material === "stone") {
          const gradient = ctx.createLinearGradient(x, y, x + w, y + h);
          gradient.addColorStop(0, "#c5cac9");
          gradient.addColorStop(0.38, "#9da5a5");
          gradient.addColorStop(1, "#70787a");
          roundRectPath(x, y, w, h, Math.min(5, h * 0.14));
          ctx.fillStyle = gradient;
          ctx.fill();
          ctx.save();
          roundRectPath(x, y, w, h, Math.min(5, h * 0.14));
          ctx.clip();
          for (let i = 0; i < 14; i += 1) {
            const px = x + hash(p.seed + i * 3.2) * w;
            const py = y + hash(p.seed + i * 5.7 + 4) * h;
            ctx.fillStyle = i % 3 === 0 ? "rgba(255,255,255,0.14)" : "rgba(45,52,52,0.16)";
            ctx.beginPath();
            ctx.arc(px, py, rand(0.8, 2.6), 0, Math.PI * 2);
            ctx.fill();
          }
          drawCracks(w, h, p.health / p.maxHealth, p.seed, "rgba(42,46,44,0.5)");
          ctx.restore();
          ctx.strokeStyle = "rgba(73, 82, 82, 0.85)";
          ctx.lineWidth = 2.2;
          roundRectPath(x, y, w, h, Math.min(5, h * 0.14));
          ctx.stroke();
          ctx.fillStyle = "rgba(255, 246, 216, 0.24)";
          ctx.fillRect(x + 4, y + 4, w - 8, 2);
        }
        ctx.restore();
      }

      function drawTNT(body) {
        const p = body.plugin;
        if (!p || p.dead) return;
        ctx.save();
        ctx.translate(body.position.x, body.position.y);
        if (p.ignited) {
          const pulse = 0.65 + Math.sin(elapsed * 24) * 0.35;
          const glow = ctx.createRadialGradient(0, 0, 6, 0, 0, 72);
          glow.addColorStop(0, `rgba(255, 190, 65, ${0.36 * pulse})`);
          glow.addColorStop(1, "rgba(255, 128, 40, 0)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, 72, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.rotate(body.angle);
        const w = p.w;
        const h = p.h;
        const x = -w / 2;
        const y = -h / 2;
        const gradient = ctx.createLinearGradient(x, y, x + w, y + h);
        gradient.addColorStop(0, "#e45542");
        gradient.addColorStop(0.55, "#b62d24");
        gradient.addColorStop(1, "#7f1c18");
        roundRectPath(x, y, w, h, 5);
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.strokeStyle = "#5e1612";
        ctx.lineWidth = 2.4;
        ctx.stroke();
        ctx.fillStyle = "#ffcc4d";
        ctx.fillRect(x + 3, y + h * 0.36, w - 6, h * 0.21);
        ctx.fillStyle = "#582820";
        ctx.font = "900 12px 'Arial Black', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("TNT", 0, y + h * 0.47);
        ctx.fillStyle = "rgba(255, 228, 156, 0.55)";
        for (let i = 0; i < 4; i += 1) {
          ctx.beginPath();
          ctx.arc(x + 6 + (i % 2) * (w - 12), y + 6 + Math.floor(i / 2) * (h - 12), 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = "#31201a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.quadraticCurveTo(8, y - 10, 2, y - 19);
        ctx.stroke();
        if (p.ignited) {
          const spark = 3 + Math.sin(elapsed * 34) * 1.5;
          ctx.fillStyle = "#ffe27a";
          ctx.beginPath();
          ctx.arc(2, y - 20, spark, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255, 95, 47, 0.7)";
          ctx.beginPath();
          ctx.arc(2, y - 20, spark * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawPig(pig) {
        const p = pig.plugin;
        if (!p || p.dead) return;
        const r = p.radius;
        const health = p.health / p.maxHealth;
        const blink = Math.sin(elapsed * 2.1 + p.blinkOffset) > 0.975;
        ctx.save();
        ctx.translate(pig.position.x, pig.position.y + r * 0.85);
        ctx.scale(1, 0.32);
        ctx.fillStyle = "rgba(34, 48, 21, 0.18)";
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(pig.position.x, pig.position.y);
        ctx.rotate(pig.angle);
        const bodyGradient = ctx.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.12, 0, 0, r * 1.1);
        bodyGradient.addColorStop(0, "#b9e679");
        bodyGradient.addColorStop(0.48, "#7dc44a");
        bodyGradient.addColorStop(1, "#4b8f2c");
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(51, 101, 28, 0.65)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#68ad3e";
        ctx.strokeStyle = "rgba(51, 101, 28, 0.55)";
        ctx.lineWidth = 1.6;
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(side * r * 0.36, -r * 0.77);
          ctx.quadraticCurveTo(side * r * 0.58, -r * 1.22, side * r * 0.2, -r * 1.03);
          ctx.quadraticCurveTo(side * r * 0.08, -r * 0.86, side * r * 0.12, -r * 0.72);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        ctx.fillStyle = "#91d059";
        ctx.beginPath();
        ctx.ellipse(0, r * 0.32, r * 0.48, r * 0.34, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(47, 100, 24, 0.35)";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = "#4e8a2a";
        ctx.beginPath();
        ctx.ellipse(-r * 0.15, r * 0.32, r * 0.07, r * 0.1, 0, 0, Math.PI * 2);
        ctx.ellipse(r * 0.15, r * 0.32, r * 0.07, r * 0.1, 0, 0, Math.PI * 2);
        ctx.fill();

        if (blink) {
          ctx.strokeStyle = "#2f4a1d";
          ctx.lineWidth = 2;
          for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(side * r * 0.12 - r * 0.12, -r * 0.22);
            ctx.lineTo(side * r * 0.12 + r * 0.12, -r * 0.22);
            ctx.stroke();
          }
        } else {
          ctx.fillStyle = "#ffffff";
